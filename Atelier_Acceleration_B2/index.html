/* ---------------- activity registry ---------------- */
var ACTS = [];
function reg(k){ if(ACTS.indexOf(k)<0) ACTS.push(k); }
(function scan(){
  function walk(bs){
    bs.forEach(function(b){
      if(b.t==="open") reg(b.k);
      else if(b.t==="tf"||b.t==="order"||b.t==="match"||b.t==="classify"||b.t==="scale") reg(b.k);
      else if(b.t==="gaps") reg(b.k);
      else if(b.t==="clip"){ (b.ex||[]).forEach(function(x){ reg(x.k); }); }
      else if(b.t==="card"&&b.blocks) walk(b.blocks);
    });
  }
  STEPS.forEach(function(s){ walk(s.blocks); });
})();

function isDone(k){
  var v = state.a[k];
  if(v==null) return false;
  if(typeof v === "string") return v.trim().length>2;
  if(typeof v === "object") return Object.keys(v).length>0;
  return false;
}
function stepDone(s){
  var ks = stepKeys(s);
  if(!ks.length) return false;
  var n=0; ks.forEach(function(k){ if(isDone(k)) n++; });
  return n >= Math.ceil(ks.length*0.7);
}
function stepKeys(s){
  var out=[];
  function walk(bs){ bs.forEach(function(b){
    if(b.t==="open"||b.t==="tf"||b.t==="order"||b.t==="match"||b.t==="classify"||b.t==="scale"||b.t==="gaps"){ if(b.k) out.push(b.k); }
    else if(b.t==="clip"){ (b.ex||[]).forEach(function(x){ out.push(x.k); }); }
    else if(b.t==="card"&&b.blocks) walk(b.blocks);
  });}
  walk(s.blocks); return out;
}

/* ---------------- renderers ---------------- */
function mkReveal(labelText, contentHTML){
  var wrap = el("div");
  var btn = el("button","btn btn-ghost small", labelText||"Voir une réponse possible");
  var box = html("div","reveal","<div class='rt'>Réponse possible — un modèle, pas une correction</div>"+contentHTML);
  box.hidden = true;
  btn.addEventListener("click", function(){
    box.hidden = !box.hidden;
    btn.textContent = box.hidden ? (labelText||"Voir une réponse possible") : "Masquer";
  });
  var row = el("div","row"); row.appendChild(btn);
  wrap.appendChild(row); wrap.appendChild(box);
  return wrap;
}

function rOpen(b){
  var n = el("div","q");
  var lbl = el("div","q-lbl");
  if(b.n) lbl.appendChild(el("span","q-n", b.n+"."));
  lbl.appendChild(html("div","q-t", b.q));
  n.appendChild(lbl);
  if(b.hint) n.appendChild(html("div","q-hint", b.hint));
  var ta = el("textarea");
  ta.id = "f_"+b.k;
  ta.placeholder = "Votre réponse…";
  ta.value = state.a[b.k] || "";
  var flag = el("span","saved","enregistré");
  function touched(){
    state.a[b.k] = ta.value; saveSoon(); flag.classList.add("on");
    clearTimeout(ta._t); ta._t = setTimeout(function(){ flag.classList.remove("on"); },1200);
    updateProgress();
  }
  ta.addEventListener("input", touched);
  if(b.starters && b.starters.length){
    var sw = el("div","starters");
    sw.appendChild(el("span","starters-lbl","Amorces — cliquez pour insérer"));
    b.starters.forEach(function(st){
      var bt = el("button","starter", st); bt.type = "button";
      bt.setAttribute("aria-label", "Insérer l'amorce : "+st);
      bt.addEventListener("click", function(){
        var cur = ta.value;
        ta.value = (cur && !/\s$/.test(cur) ? cur+" " : cur) + st + " ";
        ta.focus();
        try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
        touched();
      });
      sw.appendChild(bt);
    });
    n.appendChild(sw);
  }
  n.appendChild(ta);
  var foot = el("div","row");
  foot.appendChild(flag);
  n.appendChild(foot);
  if(b.model) n.appendChild(mkReveal(null, "<div>"+b.model+"</div>"));
  return n;
}

function rTf(b){
  var wrap = el("div","tf-list");
  var store = state.a[b.k] || (state.a[b.k] = {});
  b.items.forEach(function(it, i){
    var box = el("div","tf-item");
    var top = el("div","tf-top");
    top.appendChild(html("div","tf-txt","<strong style='font-family:var(--mono);font-size:12px;color:var(--muted)'>"+(i+1)+"</strong> &nbsp;"+it.q));
    var btns = el("div","tf-btns");
    var verdict = html("div","verdict","");
    verdict.hidden = true;
    function apply(val){
      store[i] = val; saveSoon();
      bV.setAttribute("aria-pressed", val==="V"?"true":"false");
      bF.setAttribute("aria-pressed", val==="F"?"true":"false");
      var right = (val==="V") === it.a;
      box.classList.toggle("ok", right); box.classList.toggle("no", !right);
      verdict.hidden = false;
      verdict.innerHTML = "<span class='vi'>"+(right?"✓ Exact":"✗ Non")+"</span><span>"+it.j+"</span>";
      updateProgress();
    }
    var bV = el("button","pick","Vrai"); bV.type="button"; bV.setAttribute("aria-pressed","false");
    var bF = el("button","pick","Faux"); bF.type="button"; bF.setAttribute("aria-pressed","false");
    bV.addEventListener("click", function(){ apply("V"); });
    bF.addEventListener("click", function(){ apply("F"); });
    btns.appendChild(bV); btns.appendChild(bF);
    top.appendChild(btns);
    box.appendChild(top); box.appendChild(verdict);
    wrap.appendChild(box);
    if(store[i]) apply(store[i]);
  });
  return wrap;
}

function rGaps(b){
  var wrap = el("div","gaps");
  var store = state.a[b.k] || (state.a[b.k] = {});
  var inputs = [];
  b.fields.forEach(function(f){
    var row = el("div","gap-row");
    row.appendChild(html("div","gap-lbl", f.label));
    var box = el("div","gap-in");
    var inp = document.createElement("input");
    inp.type="text"; inp.id = "f_"+b.k+"_"+f.k;
    inp.value = store[f.k] || "";
    inp.setAttribute("aria-label", f.label.replace(/<[^>]+>/g,""));
    inp.addEventListener("input", function(){
      store[f.k] = inp.value; inp.classList.remove("ok","no"); sol.textContent=""; saveSoon(); updateProgress();
    });
    box.appendChild(inp);
    if(f.suf) box.appendChild(el("span","gap-suf", f.suf));
    var sol = el("span","gap-sol","");
    box.appendChild(sol);
    row.appendChild(box);
    wrap.appendChild(row);
    inputs.push({inp:inp, f:f, sol:sol});
  });
  var bar = el("div","row");
  var check = el("button","btn","Vérifier");
  check.addEventListener("click", function(){
    inputs.forEach(function(o){
      var right = matches(o.inp.value, o.f.answers);
      o.inp.classList.toggle("ok", right); o.inp.classList.toggle("no", !right);
      o.sol.textContent = right ? "✓" : ("→ "+o.f.sol);
      o.sol.style.color = right ? "var(--ok)" : "var(--no)";
    });
  });
  bar.appendChild(check);
  wrap.appendChild(bar);
  return wrap;
}

function rOrder(b){
  var wrap = el("div");
  wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="11px";
  if(b.prompt) wrap.appendChild(html("div","q-t", b.prompt));
  var slot = el("div","ord-slot");
  var pool = el("div","ord-pool");
  var chosen = (state.a[b.k] && state.a[b.k].seq) ? state.a[b.k].seq.slice() : [];
  function render(){
    slot.innerHTML=""; pool.innerHTML="";
    if(!chosen.length){ slot.appendChild(el("span","ph","Cliquez les éléments dans l'ordre…")); }
    chosen.forEach(function(id, i){
      var it = b.items.filter(function(x){return x.id===id;})[0];
      var s = el("div","seq");
      s.appendChild(el("span","sn",(i+1)+"."));
      s.appendChild(el("span",null,it.label));
      slot.appendChild(s);
    });
    b.items.forEach(function(it){
      var c = el("button","chip"); c.type="button";
      c.innerHTML = "<span class='ck'>"+it.id+"</span>"+it.label;
      if(chosen.indexOf(it.id)>=0) c.disabled = true;
      c.addEventListener("click", function(){
        chosen.push(it.id);
        state.a[b.k] = {seq:chosen.slice()}; saveSoon(); slot.classList.remove("ok","no"); msg.textContent="";
        render(); updateProgress();
      });
      pool.appendChild(c);
    });
  }
  var bar = el("div","row");
  var check = el("button","btn","Vérifier");
  var undo = el("button","btn btn-ghost","Recommencer");
  var msg = el("span","small");
  check.addEventListener("click", function(){
    if(chosen.length !== b.solution.length){ msg.textContent="Placez d'abord tous les éléments."; msg.style.color="var(--muted)"; return; }
    var right = chosen.join("") === b.solution.join("");
    slot.classList.toggle("ok", right); slot.classList.toggle("no", !right);
    msg.textContent = right ? "✓ C'est l'ordre du reportage." : ("✗ L'ordre est : "+b.solution.join(" → "));
    msg.style.color = right ? "var(--ok)" : "var(--no)";
  });
  undo.addEventListener("click", function(){
    chosen = []; state.a[b.k]={seq:[]}; saveSoon(); slot.classList.remove("ok","no"); msg.textContent=""; render(); updateProgress();
  });
  bar.appendChild(check); bar.appendChild(undo); bar.appendChild(msg);
  wrap.appendChild(slot); wrap.appendChild(pool); wrap.appendChild(bar);
  render();
  return wrap;
}

function rMatch(b){
  var wrap = el("div");
  wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="10px";
  var store = state.a[b.k] || (state.a[b.k] = {});
  var sels = [];
  b.rows.forEach(function(r, i){
    var row = el("div","mt-row");
    row.appendChild(html("div","mt-left", r.left));
    var s = document.createElement("select");
    s.id = "f_"+b.k+"_"+i;
    s.setAttribute("aria-label", r.left);
    var o0 = document.createElement("option"); o0.value=""; o0.textContent="— choisir —"; s.appendChild(o0);
    b.options.forEach(function(op){
      var o = document.createElement("option"); o.value=op; o.textContent=op; s.appendChild(o);
    });
    s.value = store[i] || "";
    s.addEventListener("change", function(){ store[i]=s.value; s.classList.remove("ok","no"); saveSoon(); updateProgress(); });
    row.appendChild(s);
    wrap.appendChild(row);
    sels.push({s:s, r:r});
  });
  var bar = el("div","row");
  var check = el("button","btn","Vérifier");
  check.addEventListener("click", function(){
    sels.forEach(function(o){
      var right = o.s.value === o.r.answer;
      o.s.classList.toggle("ok", right); o.s.classList.toggle("no", !right);
      if(!right && o.s.value) o.s.title = "Réponse attendue : "+o.r.answer;
    });
  });
  bar.appendChild(check);
  wrap.appendChild(bar);
  return wrap;
}

function rClassify(b){
  var wrap = el("div");
  wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="10px";
  var store = state.a[b.k] || (state.a[b.k] = {});
  b.items.forEach(function(it, i){
    var box = el("div","cl-item");
    box.appendChild(html("div","cl-q", it.q));
    var opts = el("div","cl-opts");
    var btns = [];
    function paint(){
      var v = store[i];
      btns.forEach(function(x){ x.b.setAttribute("aria-pressed", x.c===v ? "true":"false"); });
      if(v){
        var right = v === it.a;
        box.classList.toggle("ok", right); box.classList.toggle("no", !right);
        fb.hidden = false;
        fb.innerHTML = right ? "<span class='vi'>✓ Exact</span>" : "<span class='vi'>✗ Non</span><span>Il s'agit d'un énoncé de type « "+it.a+" ».</span>";
      }
    }
    b.cats.forEach(function(c){
      var bt = el("button","pick", c); bt.type="button"; bt.setAttribute("aria-pressed","false");
      bt.style.minWidth="auto";
      bt.addEventListener("click", function(){ store[i]=c; saveSoon(); paint(); updateProgress(); });
      opts.appendChild(bt); btns.push({b:bt,c:c});
    });
    var fb = html("div","verdict",""); fb.hidden = true;
    box.appendChild(opts); box.appendChild(fb);
    wrap.appendChild(box);
    paint();
  });
  return wrap;
}

function rCards(b){
  var wrap = el("div");
  wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="22px";
  b.groups.forEach(function(g, gi){
    var grp = el("div","grp");
    grp.appendChild(el("div","grp-h", g.name));
    var grid = el("div","cgrid");
    g.items.forEach(function(pair, ii){
      var id = gi+"-"+ii;
      var c = el("button","fc"); c.type="button";
      var term = el("div","term", pair[0]);
      var tap = el("div","tap","cliquer pour la définition");
      var def = el("div","def", pair[1]); def.hidden = true;
      var mark = el("span","fc-mark","?");
      c.appendChild(mark); c.appendChild(term); c.appendChild(tap); c.appendChild(def);
      function paint(){
        var known = !!state.known[id];
        c.classList.toggle("known", known);
        mark.textContent = known ? "su" : "?";
      }
      c.addEventListener("click", function(){
        if(def.hidden){ def.hidden=false; tap.hidden=true; }
        else { state.known[id] = !state.known[id]; saveSoon(); paint(); }
      });
      paint();
      grid.appendChild(c);
    });
    grp.appendChild(grid);
    wrap.appendChild(grp);
  });
  wrap.appendChild(html("div","small muted","<em>Premier clic : la définition. Second clic : marquer la carte comme sue.</em>"));
  return wrap;
}

function rClip(b){
  var box = el("div","clip");
  var head = el("div","clip-h");
  head.appendChild(el("h3", null, b.title));
  head.appendChild(tcLink(b.sec, "vers "+mmss(b.sec)));
  box.appendChild(head);
  var bq = el("blockquote"); bq.textContent = "« "+b.quote+" »";
  box.appendChild(bq);
  box.appendChild(html("div","prose", b.focus));
  (b.ex||[]).forEach(function(x){
    box.appendChild(el("hr","hr"));
    box.appendChild(rOpen({t:"open", k:x.k, q:x.q, model:x.model}));
  });
  return box;
}

function rScale(b){
  var wrap = el("div","sc-wrap");
  var store = state.a[b.k] || (state.a[b.k] = {});
  var tbl = el("table","sc-tbl");
  var thead = el("thead"); var trh = el("tr");
  trh.appendChild(el("th",null,"Je suis capable de…"));
  b.cols.forEach(function(c){ trh.appendChild(el("th",null,c)); });
  thead.appendChild(trh); tbl.appendChild(thead);
  var tb = el("tbody");
  b.rows.forEach(function(r, i){
    var tr = el("tr");
    tr.appendChild(el("td",null,r));
    var btns=[];
    b.cols.forEach(function(c, ci){
      var td = el("td");
      var bt = el("button","rad"); bt.type="button";
      bt.setAttribute("aria-label", r+" : "+c);
      bt.setAttribute("aria-pressed", store[i]===ci ? "true":"false");
      bt.addEventListener("click", function(){
        store[i]=ci; saveSoon();
        btns.forEach(function(o,oi){ o.setAttribute("aria-pressed", oi===ci ? "true":"false"); });
        updateProgress();
      });
      btns.push(bt); td.appendChild(bt); tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl);
  return wrap;
}

function rPlay(b){
  var box = el("div","callout");
  box.appendChild(el("div","ct","Visionnage"));
  var row = el("div","row");
  var a = tcLink(b.sec, b.label);
  a.style.fontSize="13.5px"; a.style.padding="7px 13px";
  row.appendChild(a);
  row.appendChild(el("span","small muted", b.note||""));
  box.appendChild(row);
  return box;
}

function rExport(){
  var box = el("div","card");
  box.appendChild(html("h3",null,"Envoyer mes réponses au formateur"));
  box.appendChild(html("p","sub","Vos réponses sont enregistrées dans ce navigateur. Le bouton ci-dessous rassemble tout dans un texte que vous pouvez copier et m'envoyer par e-mail ou message."));
  var b = el("button","btn btn-primary","Préparer mon récapitulatif");
  b.addEventListener("click", openExport);
  var row = el("div","row"); row.appendChild(b);
  box.appendChild(row);
  return box;
}

function rNote(b){ return html("div","prose", b.h); }
function rCallout(b){
  var box = el("div","callout");
  if(b.ct) box.appendChild(el("div","ct", b.ct));
  box.appendChild(html("div","prose", b.h));
  return box;
}

function renderBlock(b){
  switch(b.t){
    case "note": return rNote(b);
    case "callout": return rCallout(b);
    case "open": return rOpen(b);
    case "tf": return rTf(b);
    case "gaps": return rGaps(b);
    case "order": return rOrder(b);
    case "match": return rMatch(b);
    case "classify": return rClassify(b);
    case "cards": return rCards(b);
    case "clip": return rClip(b);
    case "scale": return rScale(b);
    case "play": return rPlay(b);
    case "export": return rExport();
    case "card": {
      var c = el("div","card");
      if(b.h3){
        var hr = el("div","row");
        hr.style.justifyContent="space-between";
        hr.appendChild(el("h3",null,b.h3));
        if(b.tc){ var g=el("div","row"); b.tc.forEach(function(t){ g.appendChild(tcLink(t.sec,t.l)); }); hr.appendChild(g); }
        c.appendChild(hr);
      } else if(b.tc){
        var g2=el("div","row"); b.tc.forEach(function(t){ g2.appendChild(tcLink(t.sec,t.l)); }); c.appendChild(g2);
      }
      if(b.sub) c.appendChild(el("p","sub", b.sub));
      (b.blocks||[]).forEach(function(x){ c.appendChild(renderBlock(x)); });
      return c;
    }
  }
  return el("div");
}

/* ---------------- shell render ---------------- */
var main = document.getElementById("main");
var rail = document.getElementById("rail");

function renderRail(){
  rail.innerHTML="";
  STEPS.forEach(function(s, i){
    var li = el("li","rail-item");
    var b = el("button","rl"); b.type="button";
    b.setAttribute("aria-current", i===state.step ? "true":"false");
    if(stepDone(s)) b.classList.add("is-done");
    b.appendChild(el("span","rl-num", String(i+1).padStart(2,"0")));
    b.appendChild(el("span","rl-title", s.title));
    b.addEventListener("click", function(){ go(i); });
    li.appendChild(b); rail.appendChild(li);
  });
}

function renderStep(){
  var s = STEPS[state.step];
  main.innerHTML="";
  var sec = el("section","step");
  var head = el("div","step-head");
  var eye = el("div","eyebrow");
  eye.appendChild(el("span",null,"Étape "+String(state.step+1).padStart(2,"0")+" / "+String(STEPS.length).padStart(2,"0")));
  eye.appendChild(el("span","dot"));
  eye.appendChild(el("span",null,s.time));
  head.appendChild(eye);
  head.appendChild(el("h2",null,s.title));
  if(s.lede) head.appendChild(el("p","lede", s.lede));
  sec.appendChild(head);
  s.blocks.forEach(function(b){ sec.appendChild(renderBlock(b)); });

  var nav = el("div","stepnav");
  var prev = el("button","btn","← "+(state.step>0 ? STEPS[state.step-1].title : "Début"));
  prev.disabled = state.step===0;
  if(prev.disabled){ prev.style.opacity=".4"; prev.style.cursor="default"; }
  prev.addEventListener("click", function(){ if(state.step>0) go(state.step-1); });
  var next = el("button","btn btn-primary", (state.step<STEPS.length-1 ? STEPS[state.step+1].title : "Terminé")+" →");
  next.disabled = state.step===STEPS.length-1;
  if(next.disabled){ next.style.opacity=".4"; next.style.cursor="default"; }
  next.addEventListener("click", function(){ if(state.step<STEPS.length-1) go(state.step+1); });
  nav.appendChild(prev); nav.appendChild(next);
  sec.appendChild(nav);
  main.appendChild(sec);
}

function go(i){
  state.step = i; save();
  renderStep(); renderRail();
  window.scrollTo({top:0, behavior:"smooth"});
}

var progFill = document.getElementById("progFill");
var progNum = document.getElementById("progNum");
function updateProgress(){
  var n=0; ACTS.forEach(function(k){ if(isDone(k)) n++; });
  var pct = ACTS.length ? Math.round(n/ACTS.length*100) : 0;
  progFill.style.width = pct+"%";
  progNum.textContent = n+" / "+ACTS.length;
  renderRail();
}

/* ---------------- export ---------------- */
function textOf(k){
  var v = state.a[k];
  if(v==null) return "";
  if(typeof v==="string") return v.trim();
  return "";
}
function buildExport(){
  var L=[];
  L.push("ATELIER ACCÉLÉRATION — conversation orale B2 (45 min)");
  L.push("Documentaire ARTE « Est-il vrai que tout va toujours plus vite ? »");
  L.push("Exporté le "+new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}));
  var n=0; ACTS.forEach(function(k){ if(isDone(k)) n++; });
  L.push("Avancement : "+n+" activités sur "+ACTS.length);
  L.push("");
  STEPS.forEach(function(s, si){
    var lines=[];
    function walk(bs){
      bs.forEach(function(b){
        if(b.t==="open"){
          var t = textOf(b.k);
          if(t) lines.push("• "+b.q.replace(/<[^>]+>/g,"")+"\n  → "+t);
        } else if(b.t==="clip"){
          (b.ex||[]).forEach(function(x){
            var t = textOf(x.k);
            if(t) lines.push("• "+x.q.replace(/<[^>]+>/g,"")+"\n  → "+t);
          });
        } else if(b.t==="scale"){
          var st = state.a[b.k]||{};
          b.rows.forEach(function(r,i){
            if(st[i]!=null) lines.push("• "+r+" : "+b.cols[st[i]]);
          });
        } else if(b.t==="card" && b.blocks){ walk(b.blocks); }
      });
    }
    walk(s.blocks);
    if(lines.length){
      L.push("──────────────────────────────");
      L.push(String(si+1).padStart(2,"0")+". "+s.title.toUpperCase());
      L.push("");
      L.push(lines.join("\n\n"));
      L.push("");
    }
  });
  if(L.length<=5) L.push("(Aucune réponse rédigée pour l'instant.)");
  return L.join("\n");
}
function openExport(){
  var mask = el("div","mask");
  var m = el("div","modal");
  m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Récapitulatif de mes réponses");
  m.appendChild(html("h3",null,"Mon récapitulatif"));
  m.appendChild(html("p","sub","Copiez ce texte et envoyez-le à votre formateur avant le cours."));
  var ta = el("textarea"); ta.id="exportArea"; ta.value = buildExport(); ta.readOnly = true;
  m.appendChild(ta);
  var row = el("div","row");
  var copy = el("button","btn btn-primary","Copier le texte");
  var status = el("span","small muted","");
  copy.addEventListener("click", function(){
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done=false;
    try{ done = document.execCommand("copy"); }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ status.textContent="Copié ✓"; status.style.color="var(--ok)"; },
        function(){ if(!done) status.textContent="Sélectionnez le texte puis Ctrl/Cmd + C."; });
    } else {
      status.textContent = done ? "Copié ✓" : "Sélectionnez le texte puis Ctrl/Cmd + C.";
      status.style.color = done ? "var(--ok)" : "var(--muted)";
    }
  });
  var close = el("button","btn","Fermer");
  function shut(){ mask.remove(); document.removeEventListener("keydown", esc); }
  function esc(e){ if(e.key==="Escape") shut(); }
  close.addEventListener("click", shut);
  mask.addEventListener("click", function(e){ if(e.target===mask) shut(); });
  document.addEventListener("keydown", esc);
  row.appendChild(copy); row.appendChild(close); row.appendChild(status);
  m.appendChild(row);
  mask.appendChild(m);
  document.body.appendChild(mask);
  copy.focus();
}

/* ---------------- theme ---------------- */
document.getElementById("themeBtn").addEventListener("click", function(){
  var r = document.documentElement;
  var cur = r.getAttribute("data-theme");
  var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var nowDark = cur ? cur==="dark" : sysDark;
  r.setAttribute("data-theme", nowDark ? "light" : "dark");
  try{ localStorage.setItem(KEY+"-theme", nowDark ? "light":"dark"); }catch(e){}
});
(function(){ var t=null; try{ t=localStorage.getItem(KEY+"-theme"); }catch(e){} document.documentElement.setAttribute("data-theme", t==="light" ? "light" : "dark"); })();

document.getElementById("exportBtn").addEventListener("click", openExport);
document.getElementById("resetBtn").addEventListener("click", function(){
  if(!window.confirm("Effacer toutes vos réponses ? Cette action est définitive.")) return;
  state = {step:0, a:{}, done:{}, known:{}};
  save(); renderStep(); renderRail(); updateProgress();
});

/* ---------------- boot ---------------- */
if(!STORAGE_OK){
  var warn = html("div","storewarn",
    "<strong>Ce navigateur n'enregistre pas vos réponses sur cette page.</strong> "+
    "Vous pouvez travailler normalement, mais <strong>avant de fermer l'onglet</strong>, "+
    "cliquez sur « Exporter mes réponses » en haut de la page et conservez le texte.");
  document.body.insertBefore(warn, document.querySelector(".shell"));
}
load();
if(state.step<0 || state.step>=STEPS.length) state.step=0;
renderStep();
renderRail();
updateProgress();
})();
