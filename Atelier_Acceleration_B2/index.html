var SEGS = [{"t":"seg","n":1,"a":0,"b":89,"title":"Le vieux rêve d'aller plus vite","sum":"Depuis toujours, l'être humain cherche à accélérer : la roue (vers 3500 av. J.-C.) en est le symbole. Le film pose sa question centrale : vivons-nous vraiment plus vite, ou est-ce notre rapport au temps qui a changé ? Pourtant, pendant des millénaires, la vitesse de déplacement reste presque constante : 4 à 5 km/h à pied, 5 à 8 km/h à cheval.","obj":["Comprendre la problématique du documentaire et savoir la reformuler sous forme de question.","Exprimer une impression et un ressenti : <em>avoir l'impression de / que</em>.","Manipuler les ordres de grandeur et les chiffres approximatifs à l'oral (<em>environ, voire, entre… et…</em>).","Distinguer le rythme réel (mesurable) du rythme ressenti (subjectif)."],"qs":[{"type":"Compréhension","q":"Quelle est la double question que pose le documentaire dès les premières secondes ?","starters":["Le documentaire se demande si…","Autrement dit,…","Il oppose deux hypothèses :…"],"model":"« Le documentaire se demande si nous vivons réellement plus vite qu'autrefois, ou si c'est simplement notre rapport au temps qui a changé. Autrement dit, il oppose deux hypothèses : soit le monde accélère vraiment, soit c'est notre perception (<em>notre façon de le vivre</em>) qui s'est transformée. »"},{"type":"Débat","q":"D'après vous, le sentiment de « ne pas en faire assez » vient-il du monde extérieur ou de nous-mêmes ?","starters":["À mon sens, c'est un peu des deux :…","Je dirais que c'est surtout…","On se met souvent la pression tout seul…"],"model":"« À mon sens (<em>selon moi</em>), c'est un peu des deux. Le monde extérieur nous impose des délais de plus en plus serrés, c'est indéniable. Mais on se met aussi la pression tout seul (<em>on s'impose nous-mêmes une pression</em>) : on veut tout faire, tout voir, tout lire. Je dirais que l'environnement allume la mèche, et que nous, on entretient le feu. »"},{"type":"Réflexion","q":"La roue « fait encore tourner notre monde ». Quelle invention, selon vous, a le plus accéléré votre propre vie professionnelle ?","starters":["Sans hésiter, je citerais…","Ce qui a tout changé pour moi, c'est…","Avant…, alors que maintenant…"],"model":"« Sans hésiter, je citerais le smartphone. Ce qui a tout changé, ce n'est pas la vitesse de l'outil, c'est qu'il nous suit partout (<em>il est toujours avec nous</em>). Avant, le travail restait au bureau ; maintenant, il tient dans la poche. On gagne en réactivité, mais on perd la frontière entre vie pro et vie perso. »"}],"tour":[["courir après le temps","manquer de temps en permanence","Depuis la réorganisation, toute l'équipe court après le temps."],["ne pas en faire assez","avoir l'impression d'être insuffisant","J'ai toujours le sentiment de ne pas en faire assez."],["faire tourner le monde","faire fonctionner la société","Ce sont les PME qui font tourner l'économie."],["voire","et même (sert à renchérir)","Le projet prendra six mois, voire un an."]],"gram":{"t":"L'interrogation soutenue ou orale","h":"<p>Le film utilise l'inversion, qui appartient au registre soutenu : « <em>Vivons-nous</em> réellement plus vite ? ». En réunion, trois niveaux coexistent :</p><p>Soutenu : <em>Avons-nous</em> le temps ? · Courant : <em>Est-ce qu'on a</em> le temps ? · Oral familier : <em>On a le temps ?</em></p><p>À retenir : l'inversion avec <em>il</em> ou <em>elle</em> ajoute un <strong>-t-</strong> quand le verbe finit par une voyelle : <em>A-t-il validé ? Va-t-elle venir ?</em></p>"}},{"t":"seg","n":2,"a":89,"b":188,"title":"Le choc du chemin de fer","sum":"En 1804, la locomotive à vapeur fait tout basculer : dans les années 1830, on atteint 30 km/h. Les voyageurs voient le paysage se transformer en un flou de couleurs et ont des nausées ; des études affirment même que le cerveau ne supporterait pas plus de 15 à 30 km/h. Le sociologue Hartmut Rosa rappelle que le choc fut culturel et physique. En 1843, Heinrich Heine écrit que le chemin de fer « anéantit l'espace ».","obj":["Raconter un événement historique en alternant imparfait (décor, habitudes) et passé composé (événement).","Décrire une sensation physique et une réaction émotionnelle face à la nouveauté.","Comprendre une métaphore littéraire (l'espace anéanti) et la reformuler simplement.","Faire le parallèle entre une innovation passée et une innovation actuelle."],"qs":[{"type":"Compréhension","q":"Comment les premiers voyageurs réagissaient-ils à la vitesse du train, et comment ont-ils fini par s'y habituer ?","starters":["Au début, les voyageurs…","Ils avaient la nausée parce que…","Ils ont fini par comprendre qu'il fallait…"],"model":"« Au début, les voyageurs étaient carrément malades (<em>vraiment malades</em>) : en regardant par la fenêtre, ils voyaient le paysage se décomposer en un flou de couleurs, ce qui leur donnait la nausée. Des scientifiques affirmaient même que le cerveau ne supporterait pas plus de 30 km/h. Ils ont fini par comprendre qu'il fallait regarder au loin, et le corps s'est adapté. »"},{"type":"Débat","q":"Les scientifiques de l'époque disaient que le cerveau « ne supportait pas » la vitesse. Aujourd'hui, on dit la même chose des écrans et de l'IA. Est-ce la même peur ?","starters":["C'est tentant de faire le parallèle, mais…","D'un côté…, de l'autre…","La différence, c'est que…"],"model":"« C'est tentant de faire le parallèle (<em>de comparer les deux situations</em>), et il y a un point commun : chaque nouveauté provoque une panique morale. Mais la différence, c'est qu'avec le train, le corps a fini par s'adapter en quelques années. Avec les écrans, on a des études sérieuses qui montrent des effets sur l'attention. Donc je ne mettrais pas tout dans le même sac (<em>je ne confondrais pas tout</em>). »"},{"type":"Réflexion","q":"Heine écrit : « l'espace est anéanti et il ne nous reste plus que le temps ». Qu'est-ce que cela signifie pour vous, qui travaillez avec des équipes à distance ?","starters":["Pour moi, cette phrase veut dire que…","Dans mon quotidien, ça se traduit par…","Paradoxalement,…"],"model":"« Pour moi, cette phrase veut dire que la distance ne compte plus : ce qui compte, c'est le temps disponible. Dans mon quotidien, ça se traduit par des réunions avec Paris, Madrid ou l'Inde dans la même matinée, sans bouger de ma chaise. Paradoxalement, la distance a disparu, mais c'est l'agenda qui est devenu la vraie contrainte : on ne se bat plus contre les kilomètres, on se bat contre les créneaux (<em>les plages horaires</em>). »"}],"tour":[["tout bascule","tout change brusquement","Tout a basculé le jour où on est passé au télétravail."],["une véritable révolution","un changement radical","Le passage au cloud a été une véritable révolution pour nous."],["regarder au loin / prendre du recul","regarder à distance / analyser avec distance","Il faut prendre du recul avant de décider."],["pour ainsi dire","en quelque sorte (atténue une image)","Le projet est, pour ainsi dire, à l'arrêt."],["s'en trouver bouleversé","être profondément transformé par cela","Nos méthodes de travail s'en sont trouvées bouleversées."]],"gram":{"t":"Imparfait ou passé composé ?","h":"<p><strong>Imparfait</strong> = le décor, la situation, l'habitude : « Les voyageurs <em>étaient</em> assis, ils <em>regardaient</em> par la fenêtre. »</p><p><strong>Passé composé</strong> = l'événement, l'action ponctuelle ou le bilan : « Au début, le choc <em>a été</em> immense. » « On <em>a appris</em> qu'il fallait regarder au loin. »</p><p>Réflexe pour un hispanophone : c'est proche de l'opposition <em>imperfecto / pretérito</em>. Mais à l'oral, le français n'utilise pas le passé simple : <em>fue</em> se dit « <em>a été</em> », jamais « fut » en réunion.</p>"}},{"t":"seg","n":3,"a":188,"b":287,"title":"Plus vite, toujours plus vite… et les premières résistances","sum":"Les trains passent à 80, puis 160 et 200 km/h ; les trains à sustentation magnétique dépassent les 500 km/h et l'avion à réaction atteint 900 km/h. Selon la logique de Heine, le monde aurait rétréci à un soixantième de sa taille. L'accélération touche aussi la production : le métier à tisser mécanique fait passer la production de quelques centaines de mètres à 10 000 mètres par an. En Angleterre (1811-1813), des ouvriers détruisent les machines : c'est le luddisme. Mais l'accélération finit toujours par l'emporter.","obj":["Exprimer une progression chiffrée (<em>grimper à, atteindre, dépasser, faire bondir</em>).","Comprendre et expliquer un mouvement social historique (le luddisme) et ses motivations.","Exprimer la crainte et la résistance au changement dans un contexte professionnel.","Utiliser les connecteurs de cause et de conséquence."],"qs":[{"type":"Compréhension","q":"Pourquoi les ouvriers anglais ont-ils détruit les machines entre 1811 et 1813 ?","starters":["Ils l'ont fait parce qu'ils craignaient…","Le métier à tisser mécanique avait fait bondir…","C'est ce qu'on appelle…"],"model":"« Ils l'ont fait parce qu'ils craignaient pour leur salaire et leurs moyens de subsistance (<em>ce qui leur permettait de vivre</em>). Le métier à tisser mécanique avait fait bondir la production : une machine produisait environ 10 000 mètres de tissu, contre quelques centaines de mètres par an pour un tisserand. C'est ce qu'on appelle le luddisme, d'après un leader imaginaire, Ned Ludd. »"},{"type":"Débat","q":"Le film affirme que « l'accélération finit toujours par l'emporter ». Êtes-vous d'accord ? Peut-on citer une innovation qui a été rejetée ?","starters":["Globalement, je suis d'accord, mais…","Il y a quand même des contre-exemples :…","Toujours, c'est un peu fort :…"],"model":"« Globalement, je suis d'accord, mais « toujours », c'est un peu fort (<em>c'est exagéré</em>). Il y a quand même des contre-exemples : le Concorde allait deux fois plus vite que les avions classiques, et il a été abandonné en 2003, parce qu'il coûtait trop cher et polluait trop. Donc je dirais que l'accélération l'emporte quand elle est rentable, pas simplement parce qu'elle est possible. »"},{"type":"Réflexion","q":"Dans votre entreprise, avez-vous observé une forme de « luddisme » face à un nouvel outil ou à une transformation ? Comment la résistance a-t-elle été gérée ?","starters":["Oui, j'ai vécu ça au moment de…","Les équipes ont traîné des pieds parce que…","Ce qui a permis de débloquer la situation, c'est…"],"model":"« Oui, j'ai vécu ça au moment du déploiement d'un nouvel outil de gestion. Certaines équipes ont traîné des pieds (<em>ont avancé lentement, sans enthousiasme</em>), parce qu'elles avaient peur que l'outil serve à contrôler leur travail. Ce qui a permis de débloquer la situation, c'est d'impliquer les utilisateurs dès le départ et de montrer concrètement ce qu'ils y gagnaient. »"}],"tour":[["grimper à / faire bondir","augmenter fortement / faire augmenter brutalement","Les coûts ont grimpé à 2 millions. L'IA a fait bondir la productivité."],["se heurter à","rencontrer un obstacle","Le projet s'est heurté à une forte résistance en interne."],["en fin de compte","finalement, au bout du compte","En fin de compte, la direction a validé le budget."],["finir par l'emporter","gagner au final","Le bon sens a fini par l'emporter."],["traîner des pieds","faire quelque chose sans enthousiasme, lentement","Certains services traînent des pieds pour adopter le nouvel outil."]],"gram":{"t":"Exprimer la cause","h":"<p><strong>grâce à</strong> + nom : cause positive · « grâce à des locomotives plus puissantes »</p><p><strong>à cause de</strong> + nom : cause négative · « à cause de la nouvelle machine »</p><p><strong>craignant pour</strong> + nom (participe présent) : cause, registre écrit ou soutenu · « craignant pour leur salaire, ils ont détruit les machines » = <em>comme ils craignaient pour leur salaire…</em></p><p><strong>Piège :</strong> ne dites pas « grâce à la crise, on a perdu des clients ». <em>Grâce à</em> est toujours positif ; ici, il faut <em>à cause de</em> ou <em>en raison de</em> (neutre, plus formel).</p>"}},{"t":"seg","n":4,"a":287,"b":367,"title":"Du scepticisme à l'accélération, et la prédiction de Keynes","sum":"Chaque innovation suit le même schéma : d'abord le scepticisme (« l'ordinateur, c'est non »), puis l'accélération s'impose. L'histoire de la modernité est une histoire parallèle : d'un côté, le temps gagné ; de l'autre, le sentiment de courir après le temps. En 1930, Keynes prédit que ses petits-enfants ne travailleraient qu'environ 15 heures par semaine. L'histoire lui a donné tort. Explication : les taux de croissance dépassent les taux d'accélération.","obj":["Décrire un processus en étapes (<em>d'abord… puis… quelques années plus tard…</em>).","Formuler une déduction logique au conditionnel (<em>nous devrions donc pouvoir…</em>).","Comprendre et reformuler une thèse abstraite : croissance et accélération.","Évaluer une prédiction passée et en tirer une leçon."],"qs":[{"type":"Compréhension","q":"Qu'avait prédit Keynes en 1930, et pourquoi s'est-il trompé selon le film ?","starters":["Keynes avait prédit que…","L'histoire lui a donné tort, parce que…","La formule qui explique ça, c'est…"],"model":"« Keynes avait prédit que, grâce aux gains de productivité, ses petits-enfants ne travailleraient qu'une quinzaine d'heures par semaine. L'histoire lui a donné tort (<em>a montré qu'il avait tort</em>). La formule qui explique ça, c'est que les taux de croissance dépassent les taux d'accélération : on va plus vite, mais on en fait tellement plus que le temps gagné est englouti (<em>absorbé, avalé</em>). »"},{"type":"Débat","q":"Aujourd'hui, certains prédisent que l'intelligence artificielle nous libérera du temps. Est-ce qu'on risque de refaire l'erreur de Keynes ?","starters":["J'ai bien peur que…","Tout dépend de ce qu'on fera du temps gagné :…","Si on raisonne comme Keynes, on pourrait penser que… Or…"],"model":"« J'ai bien peur que oui. Si on raisonne comme Keynes, on pourrait penser que l'IA va nous faire travailler moins. Or, dans la pratique, quand on gagne une heure, on nous demande tout de suite d'en faire plus : plus de rapports, plus de projets, plus de réunions. Tout dépend de ce qu'on fera du temps gagné : soit on le réinvestit dans la qualité, soit il sera avalé par le volume. »"},{"type":"Réflexion","q":"Pensez à un outil qui vous a fait gagner du temps au travail. Qu'avez-vous fait, concrètement, de ce temps gagné ?","starters":["Pour être honnête, ce temps a été…","Au lieu de…, j'ai fini par…","Avec le recul, je me rends compte que…"],"model":"« Pour être franc, ce temps a été immédiatement réabsorbé. Les outils de visioconférence m'ont fait gagner des heures de déplacement, mais au lieu de souffler, j'ai fini par caser (<em>placer, insérer</em>) trois réunions de plus dans la journée. Avec le recul, je me rends compte que je n'ai pas gagné du temps : j'ai gagné de la capacité, et je l'ai remplie. »"}],"tour":[["pas question de","c'est exclu, c'est hors de question","Pas question de lancer le projet sans validation."],["ça n'a pas duré (très longtemps)","ça s'est arrêté vite","Le télétravail à 100 % ? Ça n'a pas duré."],["donner tort à quelqu'un","montrer qu'il s'est trompé","Les résultats du trimestre lui ont donné tort."],["pour autant","malgré cela (en début ou milieu de phrase)","Cela signifie-t-il pour autant que nos vies sont plus rapides ?"],["s'imposer","finir par être accepté par tous","Le télétravail s'est imposé en quelques mois."]],"gram":{"t":"Le conditionnel de déduction : devoir au conditionnel","h":"<p>« Nous mettons moins de temps à nous déplacer. Nous <strong>devrions donc pouvoir</strong> vivre de manière plus sereine. »</p><p><em>Devrions</em> exprime ce qui serait logique, mais qui ne se réalise pas. C'est très utile en réunion pour souligner un décalage entre la théorie et la réalité :</p><p><em>Avec ce nouvel outil, on <strong>devrait</strong> gagner deux jours par mois… mais pour l'instant, ce n'est pas le cas.</em><br><em>Le prestataire <strong>aurait dû</strong> livrer lundi.</em> (reproche au passé)</p>"}},{"t":"seg","n":5,"a":367,"b":451,"title":"L'employée d'hôtel et l'erreur de Keynes","sum":"Exemple : une employée d'hôtel va trois fois plus vite en voiture qu'à pied. Mais la voiture a aussi réorganisé les villes : les citadins partent vers la périphérie et la distance domicile-travail est multipliée par 5, voire 7. Résultat : le trajet prend plus de temps qu'avant. Même logique pour la production : Keynes prévoyait une prospérité multipliée par 4 à 8 au XXe siècle, elle l'a été par 17. Ce qu'il n'avait pas vu venir, c'est l'avènement du consumérisme.","obj":["Suivre et reformuler un raisonnement par l'exemple (cause, effet indirect, résultat).","Maîtriser les comparaisons multiplicatives (<em>trois fois plus vite, multiplié par cinq</em>).","Parler de mobilité, de trajets domicile-travail et d'urbanisme.","Identifier un effet pervers (ou effet rebond) et l'appliquer à son domaine."],"qs":[{"type":"Compréhension","q":"Expliquez avec vos mots pourquoi l'employée d'hôtel met plus de temps qu'avant, alors qu'elle va trois fois plus vite.","starters":["Certes, en voiture, elle va…, mais…","Comme la voiture a permis de…, les gens se sont…","Du coup, la distance…"],"model":"« Certes, en voiture, elle va trois fois plus vite qu'à pied, mais la voiture a changé la ville elle-même. Comme elle permettait d'habiter plus loin, les gens se sont installés en périphérie. Du coup, la distance entre le domicile et le lieu de travail a été multipliée par cinq, voire par sept. Au final, le gain de vitesse est plus que compensé (<em>annulé et même dépassé</em>) par l'allongement du trajet. »"},{"type":"Débat","q":"Le télétravail est-il la réponse à ce paradoxe, ou crée-t-il un nouvel effet pervers ?","starters":["Sur le papier, le télétravail règle le problème, puisque…","Mais on a vu apparaître un effet pervers :…","À mon avis, la clé, c'est…"],"model":"« Sur le papier (<em>en théorie</em>), le télétravail règle le problème, puisqu'on supprime le trajet. Mais on a vu apparaître exactement le même effet pervers que dans le film : comme on peut travailler de n'importe où, certains sont partis vivre très loin des villes, et le jour où il faut revenir au bureau, le trajet est interminable. Et surtout, le temps gagné sur le trajet a souvent été rempli par… des visios. À mon avis, la clé, c'est de décider consciemment de ce qu'on fait de ce temps. »"},{"type":"Réflexion","q":"Keynes « n'avait pas vu venir » le consumérisme. Dans votre secteur, quelle transformation personne n'avait vue venir ?","starters":["Personne n'avait vu venir…","On pensait que…, alors qu'en réalité…","Ça a pris tout le monde de court."],"model":"« Dans le secteur automobile, personne n'avait vu venir la place du logiciel. On pensait que la valeur d'une voiture resterait dans le moteur et la carrosserie, alors qu'en réalité, elle se déplace vers le logiciel et les services connectés. Ça a pris tout le monde de court (<em>ça a surpris tout le monde</em>), et aujourd'hui, les constructeurs doivent se réinventer à marche forcée (<em>très vite, sous la contrainte</em>). »"}],"tour":[["prenons un exemple concret","illustrons avec un cas réel","Prenons un exemple concret : le projet de l'an dernier."],["ne cesser de + infinitif","continuer sans arrêt à","Les demandes ne cessent d'augmenter."],["c'est là que réside…","c'est précisément là que se trouve…","C'est là que réside toute la difficulté."],["ne pas voir venir","ne pas anticiper","Personne n'a vu venir la crise des semi-conducteurs."],["un effet pervers / un effet rebond","une conséquence négative inattendue","Le nouvel outil a eu un effet pervers : plus de mails qu'avant."]],"gram":{"t":"Comparer avec des multiplicateurs","h":"<p><strong>trois fois plus</strong> + adjectif ou adverbe : « elle va <em>trois fois plus vite</em> ».</p><p><strong>être multiplié par</strong> + chiffre : « la distance <em>a été multipliée par 5</em> ».</p><p><strong>deux fois moins</strong> : pour une diminution. On dit « <em>deux fois moins cher</em> », et non « deux fois plus bon marché ».</p><p><strong>plus que compensé</strong> : « le gain de vitesse est <em>plus que compensé</em> par la distance ».</p><p><strong>Piège :</strong> « le double » et « la moitié » sont des noms : <em>le budget a <strong>doublé</strong></em> / <em>on a perdu <strong>la moitié</strong> des clients</em>.</p>"}},{"t":"seg","n":6,"a":451,"b":530,"title":"10 000 objets et une hâte « inventée »","sum":"Vers 1900, un foyer comptait environ 400 objets, contre près de 10 000 aujourd'hui. Nous voyageons, communiquons et produisons plus vite, mais nous faisons aussi beaucoup plus de tout, et nous passons plus de temps à consommer. Le manque de temps ne tiendrait-il qu'à nous et à notre rapport aux technologies ? Un proverbe turc dit : « La hâte est une invention du diable ». Pour la philosophe Marianne Gronemeyer, cela signifie que la hâte est une notion inventée.","obj":["Exprimer la restriction avec <em>ne… que</em> et la quantité avec <em>davantage</em>.","Discuter de la consommation et du rapport aux objets.","Comprendre un proverbe et l'interpréter avec prudence.","Formuler une hypothèse sur une responsabilité (individuelle ou collective)."],"qs":[{"type":"Compréhension","q":"Quels chiffres le film donne-t-il sur les objets d'un foyer, et quelle conclusion en tire-t-il sur notre manque de temps ?","starters":["Vers 1900, un foyer ne comptait que…","Aujourd'hui, on en possède près de…","La conclusion, c'est que…"],"model":"« Vers 1900, un foyer ne comptait qu'environ 400 objets ; aujourd'hui, on en possède près de 10 000. La conclusion, c'est que même si on fait tout plus vite, on fait aussi beaucoup plus de choses : on voyage davantage, on communique davantage, et on passe davantage de temps à consommer. Donc on perd d'un côté ce qu'on gagne de l'autre. »"},{"type":"Débat","q":"Le manque de temps « ne tient-il qu'à nous » ? Est-ce une responsabilité individuelle ou un problème d'organisation collective ?","starters":["Je ne crois pas qu'on puisse tout mettre sur le dos de…","C'est trop facile de dire que…","La responsabilité est partagée :…"],"model":"« Je ne crois pas qu'on puisse tout mettre sur le dos des individus (<em>tout reprocher aux individus</em>). C'est trop facile de dire aux salariés « apprenez à gérer votre temps » quand l'organisation leur impose quinze réunions par semaine. La responsabilité est partagée : l'entreprise fixe le cadre, et chacun reste libre de ses choix à l'intérieur de ce cadre. »"},{"type":"Réflexion","q":"« La hâte est une invention du diable. » Y a-t-il un proverbe espagnol équivalent ? Et vous, dans quelles situations la hâte vous a-t-elle joué des tours ?","starters":["En espagnol, on dit…, ce qui correspond à peu près à…","Il m'est arrivé de…","Depuis, je me méfie de…"],"model":"« En espagnol, on dit « vísteme despacio, que tengo prisa », ce qui correspond à peu près au français « hâte-toi lentement » ou « rien ne sert de courir, il faut partir à point ». Il m'est arrivé d'envoyer un mail important trop vite, avec la mauvaise pièce jointe, à tout un comité de direction. La hâte m'a joué un sale tour (<em>m'a causé un problème</em>) ! Depuis, je me méfie de ma propre précipitation. »"}],"tour":[["ne tenir qu'à","dépendre uniquement de","La réussite du projet ne tient qu'à nous."],["mettre sur le dos de","rendre responsable, accuser","On ne peut pas tout mettre sur le dos du prestataire."],["cela me donne à réfléchir","cela me fait réfléchir","Votre remarque me donne à réfléchir."],["jouer des tours","causer des problèmes inattendus","La fatigue peut nous jouer des tours."],["rien ne sert de courir, il faut partir à point","mieux vaut anticiper que se précipiter","Rien ne sert de courir : lançons le chantier dès maintenant."]],"gram":{"t":"La restriction ne… que et la quantité davantage","h":"<p><strong>ne + verbe + que</strong> = seulement : « Un foyer <em>ne comptait qu'</em>environ 400 objets. » Le <em>que</em> se place juste avant l'élément limité.</p><p>Attention, ce n'est pas une négation : <em>je n'ai que dix minutes</em> = j'ai dix minutes, pas plus.</p><p><strong>davantage</strong> = plus, mais en fin de groupe verbal : « Nous communiquons <em>davantage</em>. » On ne dit pas « davantage vite » : avec un adjectif ou un adverbe, on garde <em>plus</em> (<em>plus vite</em>).</p>"}},{"t":"seg","n":7,"a":530,"b":639,"title":"La peste noire : la vie devient une parenthèse","sum":"En 1347, la peste noire arrive de la mer Noire et tue en quelques années 30 à 50 % de la population. Les médecins n'ont ni explication ni remède, et la cohésion sociale s'effondre. Au Moyen Âge, la vie terrestre était une épreuve avant le royaume éternel ; avec la peste, cette vision vacille. Memento mori : la mort n'est plus une délivrance mais un adversaire. La vie devient une parenthèse, prise en étau entre la naissance et la mort, et chroniquement trop courte. De cette raréfaction du temps naît l'idée d'accélération.","obj":["Comprendre un raisonnement historique et philosophique abstrait et le résumer simplement.","Utiliser la voix passive et le verbe <em>devoir</em> pour exprimer une probabilité au passé (<em>cela a dû être…</em>).","Exprimer un lien entre une vision du monde et un comportement.","Réagir avec tact à un sujet grave (la mort, les crises)."],"qs":[{"type":"Compréhension","q":"Selon Marianne Gronemeyer, en quoi la peste noire a-t-elle changé notre rapport au temps ?","starters":["Avant la peste, on voyait la vie comme…","Avec la peste, cette vision a vacillé :…","Du coup, la vie est devenue…"],"model":"« Avant la peste, on voyait la vie terrestre comme une simple épreuve avant l'éternité : on avait tout le temps, puisque la vraie vie venait après. Avec la peste, cette vision a vacillé (<em>a été ébranlée, est devenue fragile</em>) : la mort est devenue un ennemi auquel personne n'échappe. Du coup, la vie est devenue une parenthèse trop courte, et c'est de ce manque de temps qu'est née l'envie d'accélérer. »"},{"type":"Débat","q":"La pandémie de Covid-19 a-t-elle eu, selon vous, un effet comparable sur notre rapport au temps : l'envie de « profiter » davantage ?","starters":["Dans une certaine mesure, oui :…","Mais l'effet a été plus nuancé :…","On a vu les deux tendances à la fois :…"],"model":"« Dans une certaine mesure, oui. Beaucoup de gens ont remis en question leurs priorités : certains ont changé de métier, d'autres ont quitté les grandes villes. Mais l'effet a été plus nuancé qu'avec la peste : on a vu les deux tendances à la fois. D'un côté, l'envie de ralentir ; de l'autre, une frénésie de rattrapage (<em>une envie de compenser le temps perdu</em>) dès la fin des confinements : voyages, sorties, projets. »"},{"type":"Réflexion","q":"« Une parenthèse chroniquement trop courte » : ressentez-vous parfois votre vie de cette façon ? Qu'est-ce que vous auriez peur de manquer ?","starters":["Il m'arrive de ressentir ça quand…","Ce que j'aurais le plus peur de manquer, c'est…","En même temps, je relativise :…"],"model":"« Il m'arrive de ressentir ça quand je vois les années défiler (<em>passer très vite</em>) sans que j'aie réalisé certains projets personnels. Ce que j'aurais le plus peur de manquer, ce sont les moments avec mes proches, pas une promotion. En même temps, je relativise : c'est justement cette conscience du temps limité qui m'aide à fixer des priorités. »"}],"tour":[["à une vitesse fulgurante","extrêmement rapidement","L'information s'est propagée à une vitesse fulgurante."],["être abandonné à son sort","être laissé seul, sans aide","Les petites filiales ont été abandonnées à leur sort."],["vaciller","devenir instable, fragile","La confiance des clients commence à vaciller."],["pris en étau entre","coincé entre deux contraintes","Le manager est pris en étau entre la direction et son équipe."],["nul ne peut","personne ne peut (registre soutenu)","Nul ne peut prévoir l'évolution du marché."]],"gram":{"t":"Devoir pour exprimer une probabilité au passé","h":"<p>« Cela <strong>a dû être</strong> une époque de désespoir absolu. » Ici, <em>devoir</em> n'exprime pas une obligation, mais une <strong>supposition très probable</strong> (= c'était sûrement…).</p><p>En réunion : <em>Le mail <strong>a dû partir</strong> dans les spams.</em> · <em>Il <strong>a dû</strong> se tromper de salle.</em> · <em>Elle <strong>doit être</strong> en réunion</em> (probabilité au présent).</p><p>En espagnol : <em>debió de ser</em>. Le français n'ajoute pas de <em>de</em> : « il a dû <s>de</s> partir ».</p>"}},{"t":"seg","n":8,"a":639,"b":752,"title":"Newton, la vapeur et la grande promesse","sum":"L'accélération obéit à un calcul simple : il faudrait vivre plus vite pour profiter davantage de ce que le monde fait miroiter. Elle trouve son origine dans la révolution scientifique : avec les lois de Newton (1687), le temps devient une variable de calcul. La machine à vapeur marque le début de l'ère industrielle. La grande promesse de la modernité : vivre à toute allure pour mourir vieux et comblé, sans avoir l'impression d'être passé à côté de quelque chose. Question finale : est-ce un hasard européen, ou la technologie mène-t-elle partout à un rythme effréné ?","obj":["Exprimer une nécessité et un but (<em>il faudrait + infinitif, pour + infinitif</em>).","Comprendre et discuter la notion de promesse de la modernité.","Utiliser l'expression <em>passer à côté de</em> dans un contexte personnel et professionnel.","Formuler une question ouverte qui prépare une comparaison culturelle."],"qs":[{"type":"Compréhension","q":"Quelle est la « grande promesse » de la modernisation technologique décrite dans ce passage ?","starters":["La promesse, c'était de pouvoir…","L'idée, c'est que si on vit plus vite,…","En résumé,…"],"model":"« La promesse, c'était de pouvoir vivre une vie à toute allure (<em>très rapide</em>), remplie d'expériences, pour mourir vieux et comblé, sans avoir peur d'être passé à côté de quelque chose. L'idée, c'est que si on vit plus vite, on vit plus de choses. En résumé, la vitesse devait compenser la brièveté de la vie. »"},{"type":"Débat","q":"Vivre plus vite pour « en tirer le maximum » : est-ce une bonne stratégie de vie, ou un piège ?","starters":["Sur le principe, ça se tient, mais…","Le piège, c'est que…","Je dirais plutôt qu'il vaut mieux…"],"model":"« Sur le principe, ça se tient (<em>c'est logique</em>) : si le temps est limité, autant en profiter au maximum. Le piège, c'est qu'à force d'accumuler les expériences, on n'en vit vraiment aucune. On enchaîne les voyages, les séries, les projets, mais on n'a pas le temps de les digérer. Je dirais plutôt qu'il vaut mieux vivre moins de choses, mais plus intensément. »"},{"type":"Réflexion","q":"Avec la physique de Newton, le temps devient « une simple variable de calcul ». Dans vos projets, le temps est-il seulement une variable (délais, jalons, KPI) ? Qu'est-ce que cette vision oublie ?","starters":["Dans la gestion de projet, on traite le temps comme…","Ce que cette vision oublie, c'est…","Par exemple, un planning ne dit rien de…"],"model":"« Dans la gestion de projet, on traite effectivement le temps comme une ressource à optimiser : des jalons, des sprints, des délais. Ce que cette vision oublie, c'est le temps humain : le temps de comprendre, de faire confiance, de mûrir une décision. Par exemple, un planning ne dit rien du temps qu'il faut à une équipe pour adhérer à un changement (<em>pour l'accepter vraiment</em>). »"}],"tour":[["faire miroiter","présenter quelque chose de séduisant pour attirer","On nous a fait miroiter une promotion."],["en tirer le maximum","en profiter au maximum","Il faut en tirer le maximum tant que le budget est là."],["à toute allure","très vite","Il a lu le rapport à toute allure."],["passer à côté de","manquer, ne pas saisir","On est passé à côté d'une belle opportunité."],["être en mesure de","pouvoir, avoir la capacité de","Nous serons en mesure de livrer fin juin."]],"gram":{"t":"Il faudrait + infinitif / pour + infinitif","h":"<p>« <strong>Il faudrait</strong> accélérer le rythme de la vie <strong>pour</strong> profiter davantage. »</p><p><em>Il faudrait</em> (conditionnel) adoucit l'obligation : c'est une suggestion, parfaite en réunion. Comparez : <em>Il faut revoir le budget</em> (direct) / <em>Il faudrait revoir le budget</em> (diplomatique).</p><p><strong>pour + infinitif</strong> quand le sujet est le même ; <strong>pour que + subjonctif</strong> quand il change : <em>Je vous envoie le document <strong>pour que</strong> vous le <strong>relisiez</strong>.</em></p>"}},{"t":"seg","n":9,"a":752,"b":855,"title":"Huit saisons au rythme des rennes","sum":"Chez les Samis, peuple autochtone du nord de l'Europe, c'est le cycle du troupeau qui décide de ce qu'il faut faire et à quel moment. Le calendrier sâme compte huit saisons, liées à l'élevage des rennes. Le temps ne se mesure pas en jours ou en heures : il suit la nature et les migrations. Au pré-printemps, on accompagne les troupeaux vers le nord ; au printemps, avec la fonte des neiges, on installe le campement d'été ; en juillet-août, on répare les clôtures et on remplit les congélateurs de poisson et de baies.","obj":["Décrire un mode de vie et un calendrier de travail (<em>c'est… qui décide</em>, <em>se mesurer en</em>).","Comparer deux conceptions du temps : le temps cyclique (nature) et le temps de l'horloge.","Utiliser la mise en relief <em>c'est… qui / c'est… que</em>.","Relier ces conceptions aux cycles d'une entreprise (saisonnalité, clôtures, budgets)."],"qs":[{"type":"Compréhension","q":"Comment les Samis mesurent-ils le temps, et qu'est-ce qui détermine leurs activités ?","starters":["Pour eux, le temps ne se mesure pas en…, mais…","C'est… qui décide de…","Par exemple, en été,…"],"model":"« Pour eux, le temps ne se mesure pas en jours ou en heures, mais il suit les changements de la nature et les déplacements des rennes. C'est le cycle du troupeau qui décide de ce qu'il faut faire et à quel moment. Leur calendrier compte huit saisons. Par exemple, en plein été, ils réparent les clôtures et en profitent pour faire des réserves de poisson et de baies. »"},{"type":"Débat","q":"Un temps rythmé par la nature plutôt que par l'horloge : est-ce un modèle enviable, ou une vision romantique d'une vie en réalité très dure ?","starters":["Il faut se garder d'idéaliser :…","Cela dit, il y a quelque chose d'enviable dans…","Ce qui me parle, c'est…"],"model":"« Il faut se garder d'idéaliser (<em>faire attention à ne pas embellir la réalité</em>) : les conditions de vie au cercle polaire sont extrêmes, et le travail est physiquement épuisant. Cela dit, il y a quelque chose d'enviable dans le fait de savoir exactement pourquoi on fait les choses et à quel moment. Ce qui me parle, c'est ce lien direct entre l'effort et le sens. »"},{"type":"Réflexion","q":"Votre entreprise a-t-elle, elle aussi, ses « saisons » ? Décrivez le calendrier de votre année professionnelle.","starters":["Chez nous, l'année est rythmée par…","Le temps fort, c'est…","En revanche, … est une période plus calme, où l'on…"],"model":"« Chez nous, l'année est rythmée par les clôtures trimestrielles et le cycle budgétaire. Le temps fort (<em>le moment le plus intense</em>), c'est l'automne, quand on prépare les budgets de l'année suivante : tout le monde est sur le pont (<em>mobilisé</em>). En revanche, août est une période plus calme, où l'on en profite pour traiter les sujets de fond. En quelque sorte, nous aussi, nous avons nos huit saisons ! »"}],"tour":[["c'est… qui décide","c'est cet élément qui détermine","C'est le client qui décide du calendrier."],["s'aligner sur","suivre, s'adapter à","Nous nous alignons sur le calendrier du groupe."],["en profiter pour","utiliser l'occasion pour","On en profite pour faire le point."],["être sur le pont","être mobilisé, au travail","En fin d'année, toute l'équipe est sur le pont."],["un temps fort","un moment intense et important","Le salon est le temps fort de notre année."]],"gram":{"t":"La mise en relief : c'est… qui / c'est… que","h":"<p>« <strong>C'est</strong> le cycle du troupeau <strong>qui</strong> décide. » Cette structure met l'accent sur un élément. C'est l'une des marques les plus fréquentes du français oral naturel.</p><p><strong>c'est… qui</strong> met en valeur le sujet : <em>C'est le directeur qui a tranché.</em></p><p><strong>c'est… que</strong> met en valeur un complément : <em>C'est en septembre que le projet démarre.</em> · <em>C'est pour cette raison que je propose…</em></p><p>Plus naturel en réunion que « Le directeur a tranché », quand on veut corriger ou insister.</p>"}},{"t":"seg","n":10,"a":855,"b":943,"title":"Motoneiges, GPS… et e-mails le soir","sum":"Les Samis ne restent pas à l'écart de la technologie. Du temps de la grand-mère, on se déplaçait à ski, et les troupeaux, toujours accompagnés, étaient plus dociles. Aujourd'hui, les motoneiges permettent de parcourir de longues distances en un rien de temps, et chaque matin, l'éleveuse vérifie par GPS où sont ses bêtes. C'est pratique, mais le progrès a aussi apporté un surcroît de travail : dehors avec le troupeau, tout est calme et elle se sent détendue ; le soir, dans la caravane, elle ouvre ses e-mails et le travail administratif commence.","obj":["Comparer le passé et le présent (<em>à l'époque où…, aujourd'hui…</em>).","Exprimer la nuance entre avantages et inconvénients (<em>ne… pas que</em>, <em>certes… mais</em>).","Décrire un état émotionnel (calme, détente, charge mentale).","Parler de la frontière entre temps de travail et temps personnel."],"qs":[{"type":"Compréhension","q":"Qu'est-ce qui a changé entre l'époque de la grand-mère et aujourd'hui, et quel est le revers de la médaille ?","starters":["À l'époque de sa grand-mère,…","Aujourd'hui, grâce à…,…","Le revers de la médaille, c'est que…"],"model":"« À l'époque de sa grand-mère, on se déplaçait à ski et on restait tout le temps près des troupeaux, qui étaient plus dociles. Aujourd'hui, grâce aux motoneiges et au GPS, elle parcourt de longues distances en un rien de temps et sait chaque matin où sont ses bêtes. Le revers de la médaille (<em>l'inconvénient</em>), c'est le surcroît de travail administratif : le soir, les e-mails l'attendent. »"},{"type":"Débat","q":"Le progrès technique fait-il gagner du temps, ou déplace-t-il simplement le travail ailleurs ?","starters":["Je dirais qu'il le déplace plus qu'il ne le supprime :…","Le terrain est plus rapide, mais…","Tout le travail invisible…"],"model":"« Je dirais qu'il le déplace plus qu'il ne le supprime. Sur le terrain, l'éleveuse gagne un temps fou (<em>énormément de temps</em>). Mais tout ce temps est récupéré par le travail invisible : les formulaires, les déclarations, les mails. Au bureau, c'est pareil : on automatise une tâche, mais il faut ensuite documenter, reporter et justifier. »"},{"type":"Réflexion","q":"Dehors, avec les rennes, elle se sent « tout simplement détendue ». Où et quand vous sentez-vous vraiment déconnecté ?","starters":["Le seul moment où je décroche vraiment, c'est…","Je me rends compte que…","J'essaie de m'imposer…"],"model":"« Le seul moment où je décroche vraiment (<em>je ne pense plus au travail</em>), c'est quand je fais du sport ou quand je marche en montagne, le téléphone au fond du sac. Je me rends compte que ce n'est jamais au bureau ni à la maison, parce que les notifications me rattrapent partout. J'essaie de m'imposer une règle : pas de mails pro après 20 heures. »"}],"tour":[["en un rien de temps","très rapidement","Le problème a été réglé en un rien de temps."],["le revers de la médaille","l'aspect négatif d'une chose positive","Le télétravail, c'est génial, mais le revers de la médaille, c'est l'isolement."],["se rendre compte que","prendre conscience que","Je me suis rendu compte qu'on avait oublié un livrable."],["un surcroît de travail","du travail en plus","La migration a entraîné un surcroît de travail pour le support."],["décrocher","se déconnecter mentalement du travail","En vacances, j'ai du mal à décrocher."]],"gram":{"t":"Ne… pas que = pas seulement","h":"<p>« Le progrès technique <strong>n'a pas apporté que</strong> des avantages. » = il n'a pas apporté <em>seulement</em> des avantages, il a aussi apporté des inconvénients.</p><p>Ne confondez pas : <em>Il <strong>n'a apporté que</strong> des avantages</em> (uniquement des avantages) / <em>Il <strong>n'a pas apporté que</strong> des avantages</em> (pas uniquement).</p><p>À l'oral : <em>Ce projet, ce n'est pas que de la technique, c'est aussi de l'humain.</em></p><p>Et <strong>dès que</strong> + indicatif : « <em>dès que</em> je me réveille, je vérifie… » (= au moment même où). Jamais de subjonctif après <em>dès que</em>.</p>"}},{"t":"seg","n":11,"a":943,"b":1060,"title":"Le grand paradoxe de la boîte de réception","sum":"Personne n'échappe au grand paradoxe des technologies de communication : plus elles nous facilitent la vie, plus elles nous permettent de compliquer celle des autres. Il y a un déséquilibre total entre l'effort de l'expéditeur et la charge du destinataire. Gloria Mark (université de Californie) a désactivé la messagerie d'une entreprise pendant une semaine en 2012 : le stress a considérablement baissé. Comme le train a bouleversé le rapport entre temps et espace, la numérisation a redéfini le rapport entre information et espace. Des années 1950 au papier, on passe aux ordinateurs dans les années 1980, puis à Internet et aux espaces partagés : l'information devient instantanée.","obj":["Maîtriser la structure corrélative <em>plus… plus</em>.","Expliquer les résultats d'une étude (<em>nous avons mené une étude, résultat :…</em>).","Parler de la charge mentale liée aux e-mails et proposer des règles de fonctionnement.","Exprimer un déséquilibre et une asymétrie (<em>entre… et…</em>)."],"qs":[{"type":"Compréhension","q":"Quel est le « grand paradoxe » des technologies de communication, et qu'a montré l'expérience de Gloria Mark en 2012 ?","starters":["Le paradoxe, c'est que plus…, plus…","Il y a un déséquilibre entre… et…","Son équipe a désactivé…, et le résultat a été…"],"model":"« Le paradoxe, c'est que plus ces outils nous facilitent la vie, plus ils nous permettent de compliquer celle des autres. Envoyer un mail prend dix secondes à l'expéditeur, mais crée une tâche pour le destinataire : il y a un déséquilibre total entre les deux. En 2012, l'équipe de Gloria Mark a coupé la messagerie d'une entreprise pendant une semaine, et le résultat a été clair : le niveau de stress a nettement baissé (<em>a beaucoup diminué</em>). »"},{"type":"Débat","q":"Faudrait-il, comme en France avec le « droit à la déconnexion », encadrer l'usage des e-mails en entreprise ? Ou est-ce à chacun de s'organiser ?","starters":["Je suis plutôt favorable à…, à condition que…","Une loi ne suffit pas si…","Ce qui marche le mieux, d'après mon expérience, c'est…"],"model":"« Je suis plutôt favorable à un cadre, à condition qu'il soit appliqué dans les faits. En France, le droit à la déconnexion existe dans la loi depuis 2017, mais une loi ne suffit pas si les managers continuent d'envoyer des mails à 23 heures. Ce qui marche le mieux, d'après mon expérience, ce sont des règles d'équipe simples : pas de mail le soir, une réponse sous 24 heures et non sous une heure, et un appel quand c'est vraiment urgent. »"},{"type":"Réflexion","q":"Quand vous envoyez un e-mail, pensez-vous à la « charge » que vous imposez au destinataire ? Quelles bonnes pratiques pourriez-vous adopter ?","starters":["À vrai dire, je n'y pensais pas jusqu'ici…","Désormais, je pourrais…","Par exemple, avant d'envoyer, je me demande si…"],"model":"« À vrai dire, je n'y pensais pas vraiment. Désormais, je pourrais limiter les destinataires en copie, qu'on met souvent par réflexe, pour se couvrir (<em>pour se protéger</em>). Par exemple, avant d'envoyer, je me demande si un message instantané, un coup de fil (<em>un appel</em>) ou même rien du tout ne ferait pas l'affaire (<em>ne suffirait pas</em>). »"}],"tour":[["savoir pertinemment","savoir parfaitement, sans aucun doute","Il sait pertinemment que le délai est intenable."],["mettre en copie","ajouter un destinataire en CC","Pensez à mettre le chef de projet en copie."],["se couvrir","se protéger en gardant une trace","On met toute la hiérarchie en copie pour se couvrir."],["faire l'affaire","convenir, suffire","Un simple message fera l'affaire."],["mener une étude","réaliser une étude","Nous avons mené une étude auprès de 200 collaborateurs."]],"gram":{"t":"Plus…, plus… / que ce soit… ou…","h":"<p><strong>Plus</strong> elles nous facilitent la vie, <strong>plus</strong> elles nous permettent de compliquer celle des autres.</p><p>Pas d'article ni de <em>que</em> : on ne dit pas « <s>le plus</s>… <s>le plus</s> » (erreur fréquente chez les hispanophones, calquée sur <em>cuanto más… más</em>). Variantes : <em>plus… moins</em>, <em>moins… plus</em>, <em>plus on attend, plus ça coûte cher</em>.</p><p><strong>Que ce soit… ou…</strong> (+ subjonctif figé) = peu importe : « <em>Que ce soit</em> en Finlande, dans l'espace <em>ou</em> au fond des océans, personne n'y échappe. »</p>"}},{"t":"seg","n":12,"a":1060,"b":1160,"title":"47 secondes d'attention","sum":"Grâce à Internet, on condense toujours plus de travail en une journée. Mais les technologies numériques augmentent aussi le stress et affectent la concentration. En 2004, Gloria Mark mesure, chronomètre en main, le temps d'attention d'employés de bureau : 2 minutes 30 en moyenne sur un même écran. En 2019, la moyenne est tombée à 47 secondes, soit une chute de deux tiers. Et on ne peut pas rejeter la faute sur les seules notifications : les gens s'interrompent eux-mêmes aussi souvent qu'ils sont dérangés. Nous sommes conditionnés à ce rythme d'interruption constante.","obj":["Rapporter les résultats d'une étude avec précision (chiffres, évolution, pourcentages).","Exprimer une baisse (<em>chuter de, tomber à, s'effondrer</em>) et une comparaison d'égalité (<em>aussi souvent que</em>).","Distinguer interruption externe et interruption interne, et analyser ses propres habitudes.","Proposer des stratégies de concentration dans un cadre professionnel."],"qs":[{"type":"Compréhension","q":"Comment a évolué le temps d'attention entre 2004 et 2019, et pourquoi ne peut-on pas tout mettre sur le compte des notifications ?","starters":["En 2004, les gens restaient concentrés…","En 2019, la moyenne est tombée à…","Mais les notifications ne sont pas seules en cause :…"],"model":"« En 2004, les employés restaient concentrés en moyenne deux minutes et demie sur un même écran. En 2019, la moyenne est tombée à 47 secondes : elle a chuté de deux tiers. Mais les notifications ne sont pas seules en cause (<em>pas les seules responsables</em>) : l'étude montre que les gens s'interrompent eux-mêmes aussi souvent qu'ils sont dérangés par l'extérieur. Et quand les interruptions externes baissent, les internes augmentent. On est conditionnés à zapper. »"},{"type":"Débat","q":"Le multitâche est-il une compétence professionnelle, ou une illusion qui nuit à la qualité du travail ?","starters":["On le présente souvent comme une qualité, mais…","Les études montrent plutôt que…","À la rigueur, pour des tâches simples,…, mais pour…"],"model":"« On le présente souvent comme une qualité dans les offres d'emploi, mais je pense que c'est une illusion. Les études montrent plutôt qu'on ne fait pas deux choses à la fois : on passe très vite de l'une à l'autre, et chaque changement coûte de l'énergie. À la rigueur (<em>au pire, éventuellement</em>), pour des tâches simples, ça passe ; mais pour analyser un dossier complexe, il faut du temps d'attention continu. »"},{"type":"Réflexion","q":"Combien de fois pensez-vous vous interrompre vous-même par heure ? Quelle stratégie concrète pourriez-vous tester dès la semaine prochaine ?","starters":["Si je suis honnête avec moi-même,…","Je me surprends souvent à…","Je pourrais tester…"],"model":"« Si je suis honnête avec moi-même, je dirais une dizaine de fois par heure. Je me surprends souvent à ouvrir ma messagerie sans raison, juste par réflexe, dès qu'une tâche devient difficile. Je pourrais tester des plages de concentration : deux fois une heure et demie par jour, notifications coupées, avec un créneau bloqué dans mon agenda. »"}],"tour":[["chronomètre en main","en mesurant le temps très précisément","Elle a suivi les réunions chronomètre en main."],["sur le coup","au moment même, sur le moment","Sur le coup, je n'ai pas compris sa remarque."],["s'effondrer / chuter de","baisser brutalement","Les ventes ont chuté de 20 %."],["rejeter la faute sur","accuser quelqu'un ou quelque chose d'autre","Inutile de rejeter la faute sur l'outil."],["être trop réducteur","simplifier à l'excès","Dire que c'est un problème technique, c'est trop réducteur."]],"gram":{"t":"Aussi souvent que et les verbes pronominaux réfléchis","h":"<p><strong>Comparaison d'égalité</strong> : <em>aussi</em> + adjectif ou adverbe + <em>que</em> · <em>autant de</em> + nom + <em>que</em> · verbe + <em>autant que</em>.</p><p>« Les gens <em>s'interrompent eux-mêmes <strong>aussi souvent qu'</strong>ils sont dérangés</em>. » · « Il y a <em><strong>autant d'</strong>interruptions internes <strong>qu'</strong>externes</em>. »</p><p><strong>s'interrompre eux-mêmes</strong> : le pronom tonique renforcé (<em>moi-même, eux-mêmes</em>) insiste sur le fait que l'action vient du sujet. En réunion : <em>J'ai vérifié moi-même les chiffres.</em></p>"}},{"t":"seg","n":13,"a":1160,"b":1258,"title":"100 000 mots par jour et la pente glissante","sum":"Dans l'échange d'information aussi, l'accélération ne suit plus la croissance : nous traitons plus de 100 000 mots par jour, soit l'équivalent de plus de 400 pages de lettres manuscrites. L'information étant produite à un rythme effréné, on ressent la pression d'en consommer toujours plus et toujours plus vite. Chez les adolescents, 3 à 4 heures de smartphone par jour ; une utilisation intensive est liée à une baisse du bien-être, à plus d'anxiété et à une moins bonne estime de soi, surtout à cause de la comparaison sociale. Pour Hartmut Rosa, cette logique est dictée par la peur de ne plus suivre : c'est le « syndrome de la pente glissante ».","obj":["Comprendre et expliquer une métaphore conceptuelle (la pente glissante).","Exprimer la difficulté (<em>avoir du mal à</em>) et la progression (<em>de plus en plus</em>).","Discuter d'un sujet de société (jeunes et écrans) en distinguant corrélation et cause.","Exprimer une peur ou une inquiétude professionnelle (<em>la peur de + infinitif</em>)."],"qs":[{"type":"Compréhension","q":"Qu'est-ce que le « syndrome de la pente glissante » selon Hartmut Rosa ?","starters":["Il le compare à…","Autrement dit, on doit…","Et ce qui est dicté par la peur, c'est…"],"model":"« Il le compare à une pente enneigée qui se déroberait (<em>glisserait, disparaîtrait</em>) sans cesse sous nos pieds. Autrement dit, on doit courir de plus en plus vite simplement pour rester au même endroit, pour rester à la page (<em>à jour</em>). Selon lui, cette logique est dictée par la peur fondamentale de ne plus pouvoir suivre le rythme, d'être complètement dépassé. »"},{"type":"Débat","q":"Faut-il limiter l'usage du smartphone chez les adolescents, par exemple en l'interdisant à l'école ?","starters":["Je suis assez partagé :…","D'un côté…, mais de l'autre…","Plutôt que d'interdire, je miserais sur…"],"model":"« Je suis assez partagé. D'un côté, les études citées sont préoccupantes : anxiété, estime de soi, comparaison sociale permanente. En France, le téléphone est déjà interdit au collège. Mais de l'autre, interdire ne suffit pas si les adultes donnent le mauvais exemple. Plutôt que d'interdire seulement, je miserais sur (<em>je parierais sur, je privilégierais</em>) l'éducation au numérique, en montrant comment fonctionnent les algorithmes. »"},{"type":"Réflexion","q":"Avez-vous déjà ressenti cette peur d'être « dépassé » dans votre métier, par exemple face à l'intelligence artificielle ? Comment la gérez-vous ?","starters":["Oui, clairement, surtout depuis…","J'ai parfois l'impression d'avoir un train de retard…","Ce qui m'aide, c'est de…"],"model":"« Oui, clairement, surtout depuis l'arrivée de l'IA générative. J'ai parfois l'impression d'avoir un train de retard (<em>d'être en retard sur les autres</em>) : chaque semaine, il y a un nouvel outil. Ce qui m'aide, c'est de faire le tri : je ne cherche pas à tout suivre, je choisis deux ou trois sujets vraiment utiles pour mon poste, et j'accepte de laisser passer le reste. »"}],"tour":[["rester à la page","rester informé, à jour","Pour rester à la page, je lis une newsletter par semaine."],["être dépassé","ne plus arriver à suivre","Avec tous ces changements, je me sens un peu dépassé."],["se dérober sous les pieds","disparaître, ne plus offrir d'appui","J'ai eu l'impression que le sol se dérobait sous mes pieds."],["avoir un train de retard","être en retard sur une évolution","Sur l'IA, on a clairement un train de retard."],["faire le tri","sélectionner l'essentiel","Il faut faire le tri dans les priorités."]],"gram":{"t":"Avoir du mal à + infinitif / de plus en plus","h":"<p>« Pourquoi <strong>avons-nous tant de mal à</strong> poser cet appareil ? » <em>Avoir du mal à</em> = avoir des difficultés à. Préposition <strong>à</strong>, et non <em>de</em> : <em>J'ai du mal <strong>à</strong> me concentrer.</em></p><p><strong>de plus en plus</strong> / <strong>de moins en moins</strong> : « courir <em>de plus en plus vite</em> ». Avec un nom : <em>de plus en plus <strong>de</strong> réunions</em>.</p><p><strong>se déroberait</strong> : le conditionnel dans « une pente qui <em>se déroberait</em> » sert à décrire une situation imaginaire (une comparaison).</p>"}},{"t":"seg","n":14,"a":1258,"b":1341,"title":"Joignable en permanence","sum":"Notre monde en accélération, combiné à notre disponibilité permanente, impose une pression énorme, jusqu'au cercle polaire. L'éleveuse est tour à tour éleveuse, conseillère et presque juriste : l'État encadre l'élevage avec des quotas, des règles et des zones de pâturage, et les Samis n'échappent pas à la bureaucratie. Autrefois, on consultait sa boîte aux lettres de temps en temps et on lisait parfois un courrier administratif trois mois plus tard. Aujourd'hui, l'administration sait qu'on est joignable en permanence. Et l'éleveuse reconnaît : « c'est aussi de ma faute », car elle a laissé ces technologies envahir sa vie privée.","obj":["Exprimer la responsabilité et l'autocritique (<em>c'est de ma faute, j'ai laissé…</em>).","Utiliser <em>laisser</em> + infinitif (et le distinguer de <em>faire</em> + infinitif).","Décrire la multiplicité des rôles professionnels (<em>tour à tour, à la fois</em>).","Discuter de la frontière entre vie professionnelle et vie privée."],"qs":[{"type":"Compréhension","q":"Qu'est-ce qui a changé dans la relation de l'éleveuse avec l'administration, et pourquoi dit-elle que c'est « aussi de sa faute » ?","starters":["Autrefois, elle ne consultait sa boîte aux lettres que…","Aujourd'hui, l'administration sait que…","Elle reconnaît que c'est aussi de sa faute, parce qu'elle a laissé…"],"model":"« Autrefois, elle ne consultait sa boîte aux lettres que de temps en temps, et elle pouvait lire un courrier administratif trois mois plus tard. Aujourd'hui, l'administration sait qu'elle est joignable en permanence grâce au smartphone, donc elle attend des réponses rapides. Elle reconnaît que c'est aussi de sa faute, parce qu'elle a laissé ces technologies envahir sa vie privée : elle fait son mea culpa (<em>elle reconnaît sa part de responsabilité</em>). »"},{"type":"Débat","q":"Être joignable en permanence : est-ce une exigence de l'employeur, ou une habitude que nous avons prise nous-mêmes ?","starters":["C'est un cercle vicieux :…","Personne ne l'exige par écrit, mais…","À partir du moment où on répond…, on crée…"],"model":"« C'est un cercle vicieux. Personne ne l'exige noir sur blanc (<em>par écrit, officiellement</em>), mais à partir du moment où on répond à un mail à 22 heures, on crée une attente : la prochaine fois, on nous en voudra de ne pas répondre. Donc l'habitude devient une norme implicite. Pour en sortir, il faut que les managers montrent l'exemple. »"},{"type":"Réflexion","q":"Dans votre poste, combien de « casquettes » portez-vous ? Laquelle vous prend le plus de temps sans être vraiment votre métier ?","starters":["Je porte plusieurs casquettes :…","Je suis tour à tour…","Celle qui me prend le plus de temps, c'est…, alors que…"],"model":"« Je porte plusieurs casquettes (<em>j'ai plusieurs rôles</em>) : je suis tour à tour chef de projet, interlocuteur technique, négociateur avec les prestataires et parfois presque juriste quand il faut relire des contrats. Celle qui me prend le plus de temps, c'est le reporting administratif, alors que ce n'est pas du tout là que j'apporte le plus de valeur. »"}],"tour":[["être joignable","pouvoir être contacté","Je serai joignable sur mon portable jusqu'à 18 heures."],["ne pas échapper à","subir aussi, ne pas pouvoir éviter","Aucun service n'échappe aux réductions de budget."],["porter plusieurs casquettes","avoir plusieurs rôles","Dans une petite structure, on porte plusieurs casquettes."],["noir sur blanc","par écrit, de manière explicite","Je voudrais que ce soit écrit noir sur blanc dans le contrat."],["un cercle vicieux","une situation où chaque cause aggrave l'effet","Retards, stress, erreurs, puis nouveaux retards : c'est un cercle vicieux."]],"gram":{"t":"Laisser + infinitif / faire + infinitif","h":"<p>« J'<strong>ai laissé</strong> ces technologies <strong>envahir</strong> ma vie privée. » <em>Laisser + infinitif</em> = ne pas empêcher (on subit, on permet).</p><p><em>Faire + infinitif</em> = provoquer, commander : <em>J'ai <strong>fait installer</strong> une nouvelle application</em> (j'ai demandé à quelqu'un de l'installer).</p><p>En réunion : <em>Laissez-moi finir.</em> · <em>On ne peut pas laisser passer une erreur pareille.</em> · <em>Je vais faire valider le budget par la direction.</em></p><p>Et <strong>c'est de ma faute</strong> (oral courant) ou <strong>c'est ma faute</strong> (plus correct) : les deux s'entendent.</p>"}},{"t":"seg","n":15,"a":1341,"b":1445,"title":"Ne pas ralentir, mais entrer en résonance","sum":"Comment redescendre de la pente glissante ? Pour Hartmut Rosa, ralentir serait une erreur : personne ne veut d'urgentistes ou de pompiers lents, et une mauvaise connexion n'a jamais amélioré la vie de personne. L'accélération est néfaste quand elle mène à l'aliénation, quand on n'arrive plus à assimiler les choses. La solution n'est pas de mieux gérer son temps, mais d'entrer dans un échange vivant avec le monde : la résonance, c'est s'ouvrir aux choses, accepter qu'elles nous touchent et nous transforment, et sentir qu'on peut agir sur le monde. On ne peut pas être pleinement présent à la fois dans le monde numérique et dans le monde réel : il faut apprivoiser le numérique, comme nos ancêtres ont apprivoisé le train.","obj":["Comprendre et reformuler une thèse nuancée (ni pour ni contre l'accélération).","Utiliser <em>il s'agit de</em> + infinitif et <em>l'idée n'est pas de… mais de…</em>.","Définir un concept abstrait (la résonance) avec ses propres mots et un exemple.","Argumenter en rejetant une solution simpliste (<em>ce serait une erreur de croire que…</em>)."],"qs":[{"type":"Compréhension","q":"Pourquoi Hartmut Rosa pense-t-il que ralentir n'est pas la bonne réponse ? Et qu'appelle-t-il la « résonance » ?","starters":["Pour lui, ralentir serait une erreur, parce que…","L'accélération ne devient un problème que quand…","La résonance, c'est…"],"model":"« Pour lui, ralentir serait une erreur, parce que la vitesse est souvent une bonne chose : personne ne veut d'un pompier lent ou d'une mauvaise connexion. L'accélération ne devient un problème que quand elle mène à l'aliénation, quand on n'arrive plus à assimiler (<em>à intégrer, à digérer</em>) ce qu'on vit. La résonance, c'est l'inverse : s'ouvrir aux choses, qu'il s'agisse d'une discussion, d'un paysage ou d'un livre, se laisser toucher et transformer par elles, et sentir qu'on peut agir en retour. »"},{"type":"Débat","q":"Rosa affirme que « changer notre gestion du temps » ne résoudra pas le problème. Les formations en gestion du temps sont-elles donc inutiles ?","starters":["Inutiles, c'est un grand mot, mais…","Elles traitent le symptôme, pas la cause :…","Ce qui manque, c'est…"],"model":"« Inutiles, c'est un grand mot (<em>c'est exagéré</em>), mais je comprends son idée. Elles traitent le symptôme, pas la cause : on apprend à caser plus de tâches dans une journée, ce qui revient à courir plus vite sur la pente. Ce qui manque, c'est la question de fond : pourquoi est-ce que je fais tout ça, et qu'est-ce qui a vraiment du sens ? Une bonne formation devrait aider à faire moins, pas à faire plus. »"},{"type":"Réflexion","q":"Dans votre travail, quel moment récent a été un moment de « résonance » : un échange qui vous a vraiment touché ou transformé ?","starters":["Ça me fait penser à…","Ce qui a fait la différence, c'est que…","J'en suis ressorti avec…"],"model":"« Ça me fait penser à un atelier avec des utilisateurs, le mois dernier. Au lieu de présenter un PowerPoint, on les a simplement écoutés raconter leurs difficultés. Ce qui a fait la différence, c'est qu'on était tous vraiment présents : pas d'ordinateur ouvert, pas de téléphone. J'en suis ressorti avec une vision complètement différente du projet, et l'envie de le faire avancer. »"}],"tour":[["c'est une erreur de croire que","il est faux de penser que","C'est une erreur de croire que l'outil réglera tout."],["un défi de taille","un défi très important","Intégrer les deux équipes est un défi de taille."],["être pleinement présent","être totalement attentif, ici et maintenant","En réunion, j'essaie d'être pleinement présent."],["subir","supporter sans pouvoir agir","On ne veut plus subir les décisions, on veut y participer."],["apprivoiser","apprendre à maîtriser","Il nous a fallu six mois pour apprivoiser le nouvel ERP."]],"gram":{"t":"Il s'agit de… / L'idée n'est pas de…, mais de…","h":"<p>« <strong>Il s'agit de</strong> repenser notre rapport à la technologie. » <em>Il s'agit de</em> + infinitif = ce qu'il faut faire, c'est… Le sujet est toujours <em>il</em> impersonnel : on ne dit pas « <s>la réunion s'agit de</s> », mais « <em>dans cette réunion, il s'agit de…</em> » ou « <em>la réunion porte sur…</em> ».</p><p>« <strong>L'idée n'est pas de</strong> la subir, <strong>mais de</strong> la considérer comme un outil. » C'est une structure idéale pour recadrer une discussion : <em>L'idée n'est pas de chercher un coupable, mais de trouver une solution.</em></p>"}},{"t":"seg","n":16,"a":1445,"b":1516,"title":"Qu'allons-nous chercher là-haut ?","sum":"L'idée que la consommation nous libère et nous offre une table richement dressée n'est qu'une illusion : on se retrouve face à la peur de passer à côté de sa vie, avec le sentiment que la vraie vie est ailleurs et qu'on est toujours au mauvais endroit. L'accélération a grandement amélioré notre quotidien, mais elle a aussi apporté l'aliénation. La prochaine fois que nous aurons l'impression de gravir une pente glissante, il vaudra peut-être la peine de faire une pause pour nous demander ce que nous allons chercher là-haut. Pour l'éleveuse, l'élevage de rennes apporte la liberté : ne plus avoir les yeux fixés sur l'horloge.","obj":["Synthétiser le message global du documentaire en une ou deux minutes.","Utiliser l'inversion du sujet après <em>peut-être</em> et l'expression <em>valoir la peine de</em>.","Parler de la peur de manquer quelque chose (FOMO) avec des expressions natives.","Conclure une discussion : tirer un enseignement personnel et formuler une résolution concrète."],"qs":[{"type":"Compréhension","q":"Quelle est la conclusion du documentaire ? Résumez-la en deux ou trois phrases.","starters":["En définitive, le documentaire montre que…","Il ne s'agit pas de rejeter…, mais de…","La question finale, c'est…"],"model":"« En définitive (<em>pour conclure</em>), le documentaire montre que l'accélération a grandement amélioré notre quotidien, mais qu'elle nous a aussi éloignés de nous-mêmes : c'est l'aliénation. Il ne s'agit pas de rejeter le progrès, mais de se demander où il nous mène. La question finale, c'est : quand on grimpe cette pente glissante, qu'est-ce qu'on va chercher là-haut ? »"},{"type":"Débat","q":"La « peur de passer à côté de sa vie », ce qu'on appelle en anglais FOMO, est-elle aggravée par les réseaux sociaux ou existait-elle déjà avant ?","starters":["Elle ne date pas d'hier :…","Mais les réseaux sociaux l'ont décuplée, parce que…","Ce qui a changé, c'est…"],"model":"« Elle ne date pas d'hier (<em>elle est ancienne</em>) : le documentaire la fait remonter à la peste noire ! Mais les réseaux sociaux l'ont décuplée (<em>multipliée par dix, considérablement amplifiée</em>), parce qu'on voit en permanence la vie des autres, ou plutôt la meilleure version de leur vie. Ce qui a changé, c'est l'échelle : avant, on se comparait à ses voisins ; aujourd'hui, on se compare au monde entier. »"},{"type":"Réflexion","q":"« Qu'allons-nous chercher là-haut ? » Si vous faites une pause aujourd'hui : qu'est-ce que vous cherchez vraiment, au travail et dans la vie ? Et quelle petite décision concrète pourriez-vous prendre ?","starters":["Si je prends un peu de recul,…","Ce que je cherche vraiment, c'est…","Concrètement, je vais essayer de…"],"model":"« Si je prends un peu de recul, je me rends compte que je cours souvent après la reconnaissance et la performance. Mais ce que je cherche vraiment, c'est le sentiment d'être utile et d'avoir du temps pour les gens qui comptent. Concrètement, je vais essayer de lever le pied (<em>ralentir, en faire moins</em>) le vendredi après-midi : pas de nouvelles réunions, juste le temps de faire le point sur la semaine. »"}],"tour":[["passer à côté de sa vie","ne pas vivre pleinement ce qui compte","J'ai eu peur de passer à côté de ma vie en travaillant trop."],["ça ne date pas d'hier","c'est ancien, ce n'est pas nouveau","Ce problème de coordination ne date pas d'hier."],["valoir la peine de","être utile, mériter l'effort","Ça vaut la peine de revoir le processus."],["lever le pied","ralentir, réduire son rythme","Après le lancement, l'équipe va pouvoir lever le pied."],["avoir les yeux rivés sur","regarder fixement, en permanence","Il a les yeux rivés sur les indicateurs."]],"gram":{"t":"L'inversion après peut-être","h":"<p>« <strong>Peut-être vaudra-t-il</strong> la peine de faire une pause. » Quand <em>peut-être</em> est en tête de phrase, le français soutenu inverse le sujet (avec le <em>-t-</em> euphonique).</p><p>Trois façons de dire la même chose :</p><p>Soutenu : <em>Peut-être faudrait-il revoir le calendrier.</em><br>Courant : <em>Peut-être qu'il faudrait revoir le calendrier.</em><br>Simple : <em>Il faudrait peut-être revoir le calendrier.</em></p><p>En réunion, la version courante ou simple est parfaite. La version soutenue fait très bonne impression à l'écrit.</p>"}}];

var LETTERS = "ABCDEFGH";
function segCard(s, idx){
  var blocks = [];
  blocks.push({t:"note", h:"<div class='prose'><p><em>En bref.</em> "+s.sum+"</p></div>"});
  blocks.push({t:"callout", ct:"Objectifs pédagogiques du segment", h:"<ul style='margin:0;padding-left:18px'>"+s.obj.map(function(o){return "<li>"+o+"</li>";}).join("")+"</ul>"});
  var ex = EX[s.n];
  if(ex){
    if(ex.t==="gaps") blocks.push({t:"gaps", k:"x"+s.n, fields:ex.fields});
    else blocks.push({t:"tf", k:"x"+s.n, items:ex.items});
  }
  s.qs.forEach(function(q, i){
    blocks.push({t:"open", k:"s"+s.n+"_"+i, n:String(i+1), starters:q.starters,
      q:"<strong>"+q.type+".</strong> "+q.q, hint:q.hint, model:q.model});
  });
  blocks.push({t:"callout", ct:"Focus langue — tournures et constructions clés",
    h:"<ul style='margin:0;padding-left:18px'>"+s.tour.map(function(t){
        return "<li><strong>"+t[0]+"</strong> ("+t[1]+") — <em>« "+t[2]+" »</em></li>";}).join("")+"</ul>"+
      "<p><strong>Construction clé : "+s.gram.t+"</strong></p>"+s.gram.h});
  return {t:"card", h3:LETTERS[idx]+". Segment "+s.n+" — "+s.title,
    sub:(ex ? (ex.t==="gaps" ? "Repérez d'abord les chiffres, puis passez aux trois questions." : "Vrai ou faux, puis les trois questions.") : ""),
    tc:[{sec:s.a, l:mmss(s.a)},{sec:s.b, l:mmss(s.b)}], blocks:blocks};
}
