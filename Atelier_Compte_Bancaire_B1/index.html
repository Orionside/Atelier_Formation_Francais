<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atelier Compte bancaire B1+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@600;700&display=swap">
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F7F9;
  --ink:#131B24; --muted:#5B6B7A; --line:#D5DDE4; --line-strong:#B9C5CF;
  --accent:#8F5406; --accent-ink:#8F5406; --accent-soft:#F3E6D2;
  --ok:#186A42; --ok-soft:#DCEFE4; --no:#9E2A21; --no-soft:#F8E2DF;
  --focus:#1F5FA8;
  --shadow:0 1px 2px rgba(19,27,36,.06), 0 8px 24px -16px rgba(19,27,36,.28);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A; --surface:#161E26; --surface-2:#1C262F;
    --ink:#E3EAF0; --muted:#94A4B3; --line:#2A3743; --line-strong:#3C4C5A;
    --accent:#E0A85C; --accent-ink:#E9BC7E; --accent-soft:#382915;
    --ok:#62C18E; --ok-soft:#15301F; --no:#EE9088; --no-soft:#331816;
    --focus:#82B6EB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161E26; --surface-2:#1C262F;
  --ink:#E3EAF0; --muted:#94A4B3; --line:#2A3743; --line-strong:#3C4C5A;
  --accent:#E0A85C; --accent-ink:#E9BC7E; --accent-soft:#382915;
  --ok:#62C18E; --ok-soft:#15301F; --no:#EE9088; --no-soft:#331816;
  --focus:#82B6EB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--serif); font-weight:700; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1180px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.brand b{font-family:var(--serif); font-size:17px; font-weight:700; white-space:nowrap}
.brand span{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.prog{display:flex; align-items:center; gap:9px}
.prog-track{width:120px; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.prog-fill{height:100%; width:0%; background:var(--accent); transition:width .35s ease}
.prog-num{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:7px; font-size:13.5px; font-weight:500;
  transition:background .15s, border-color .15s;
}
.btn:hover{background:var(--surface-2); border-color:var(--muted)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn-primary, :root:not([data-theme="light"]) .btn-primary{color:#1A1206}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{filter:brightness(1.08); background:var(--accent)}
.btn-ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}

/* ---------- shell ---------- */
.shell{max-width:1180px; margin:0 auto; padding:0 20px; padding-block:26px 64px;
  display:grid; grid-template-columns:238px minmax(0,1fr); gap:38px; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr); gap:20px} }

/* ---------- stepper ---------- */
.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 74px)}
@media (max-width:900px){
  .rail{position:static}
  .rail-list{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
  .rail-item{flex:0 0 auto; width:auto!important}
  .rail-item .rl-title{white-space:nowrap}
  .rail-head{margin-bottom:9px}
}
.rail-head{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--muted); margin-bottom:12px; padding-left:2px}
.rail-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .rail-list{flex-direction:row} }
.rail-item{width:100%}
.rl{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:8px 11px; color:var(--muted); font-size:13.5px; line-height:1.35;
  transition:background .15s, border-color .15s, color .15s;
}
.rl:hover{border-color:var(--line-strong); background:var(--surface-2); color:var(--ink)}
.rl[aria-current="true"]{
  background:var(--accent); border-color:var(--accent); color:#fff;
  font-weight:500; box-shadow:var(--shadow);
}
:root[data-theme="dark"] .rl[aria-current="true"],
:root:not([data-theme="light"]) .rl[aria-current="true"]{color:#1A1206}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .rl[aria-current="true"]{color:#fff}}
.rl-num{
  font-family:var(--mono); font-size:11px; flex:0 0 auto;
  width:23px; height:23px; display:grid; place-items:center; border-radius:6px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
}
.rl.is-done .rl-num{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.rl[aria-current="true"] .rl-num,
.rl[aria-current="true"].is-done .rl-num{
  background:rgba(255,255,255,.24); border-color:transparent; color:inherit;
}
.rl-title{min-width:0}
.rail-foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:8px; align-items:flex-start}
@media (max-width:900px){ .rail-foot{display:none} }

/* ---------- main ---------- */
main{min-width:0}
.step{display:flex; flex-direction:column; gap:20px}
.step-head{border-bottom:1px solid var(--line); padding-bottom:16px;
  display:flex; flex-direction:column; gap:7px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.eyebrow .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.step-head h2{font-size:clamp(22px,4.3vw,29px); line-height:1.2}
.step-head .lede{color:var(--muted); max-width:62ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:18px 19px;
  display:flex; flex-direction:column; gap:13px}
.card h3{font-size:17px; line-height:1.3}
.card > .sub{color:var(--muted); font-size:14px; margin-top:-6px}
.prose{max-width:66ch; display:flex; flex-direction:column; gap:11px}
.prose ul,.prose ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.prose strong{font-weight:600}
.prose em{color:var(--muted)}

.callout{border-left:3px solid var(--accent); background:var(--surface-2); border-radius:0 9px 9px 0;
  padding:14px 17px; display:flex; flex-direction:column; gap:8px; max-width:68ch}
.callout .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}

/* timecode */
.tc{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
  padding:3px 8px; color:var(--ink); text-decoration:none; white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tc:hover{border-color:var(--accent); color:var(--accent-ink)}
.tc::before{content:"▶"; font-size:8px; color:var(--accent-ink)}

/* questions */
.q{display:flex; flex-direction:column; gap:10px; padding-block:4px}
.q + .q{border-top:1px dashed var(--line); padding-top:16px}
.q-lbl{display:flex; gap:10px; align-items:baseline}
.q-n{font-family:var(--mono); font-size:12px; color:var(--accent-ink); flex:0 0 auto; font-weight:500}
.q-t{font-weight:500; max-width:64ch}
.q-hint{font-size:13.5px; color:var(--muted); max-width:64ch}
textarea{
  width:100%; min-height:82px; resize:vertical; font:inherit; font-size:14.5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; line-height:1.55;
}
textarea::placeholder{color:var(--muted); opacity:.75}
textarea:focus{border-color:var(--focus); background:var(--surface)}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.reveal{background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0; padding:13px 15px; font-size:14.5px; max-width:66ch;
  display:flex; flex-direction:column; gap:8px}
.reveal .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.saved{font-family:var(--mono); font-size:11px; color:var(--ok); opacity:0; transition:opacity .3s}
.saved.on{opacity:1}

/* amorces cliquables */
.starters{display:flex; flex-wrap:wrap; gap:6px; align-items:center; max-width:68ch}
.starters-lbl{flex:0 0 100%; font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted)}
.starter{
  border:1px solid var(--line-strong); background:var(--surface-2); border-radius:20px;
  padding:5px 13px; font-family:var(--serif); font-style:italic; font-size:13.5px;
  color:var(--muted); text-align:left; line-height:1.45; max-width:100%;
  transition:background .15s, border-color .15s, color .15s;
}
.starter:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}

/* true/false */
.tf-list{display:flex; flex-direction:column; gap:10px}
.tf-item{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:var(--surface-2);
  display:flex; flex-direction:column; gap:10px}
.tf-top{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
.tf-txt{flex:1 1 300px; min-width:0; font-size:14.5px}
.tf-btns{display:flex; gap:6px; flex:0 0 auto}
.pick{border:1px solid var(--line-strong); background:var(--surface); border-radius:7px;
  padding:5px 12px; font-size:13px; font-weight:500; min-width:62px}
.pick[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.tf-item.ok{border-color:var(--ok); background:var(--ok-soft)}
.tf-item.no{border-color:var(--no); background:var(--no-soft)}
.verdict{font-size:14px; display:flex; gap:8px; align-items:flex-start}
.verdict .vi{font-family:var(--mono); font-weight:500; flex:0 0 auto}
.ok .verdict .vi{color:var(--ok)} .no .verdict .vi{color:var(--no)}

/* gaps */
.gaps{display:flex; flex-direction:column; gap:9px}
.gap-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  border-bottom:1px dotted var(--line); padding-bottom:9px}
.gap-row:last-of-type{border-bottom:0; padding-bottom:0}
.gap-lbl{flex:1 1 240px; min-width:0; font-size:14.5px}
.gap-in{display:flex; align-items:center; gap:7px; flex:0 0 auto}
input[type="text"]{
  font:inherit; font-size:14.5px; font-family:var(--mono); width:118px; text-align:center;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong);
  border-radius:7px; padding:6px 9px;
}
input[type="text"]:focus{border-color:var(--focus); background:var(--surface)}
input.ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
input.no{border-color:var(--no); background:var(--no-soft); color:var(--no)}
.gap-suf{font-size:13.5px; color:var(--muted); font-family:var(--mono)}
.gap-sol{font-size:13px; color:var(--ok); font-family:var(--mono)}

select{
  font:inherit; font-size:14px; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:7px; padding:6px 9px; max-width:100%;
}
select:focus{border-color:var(--focus)}
select.ok{border-color:var(--ok); background:var(--ok-soft)}
select.no{border-color:var(--no); background:var(--no-soft)}

/* order */
.ord-pool{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1px solid var(--line-strong); background:var(--surface-2); border-radius:8px;
  padding:8px 12px; font-size:14px; text-align:left; max-width:100%}
.chip:hover{border-color:var(--accent)}
.chip:disabled{opacity:.34; cursor:default}
.chip .ck{font-family:var(--mono); color:var(--accent-ink); margin-right:7px; font-size:12px}
.ord-slot{display:flex; gap:8px; flex-wrap:wrap; align-items:center; min-height:40px;
  border:1px dashed var(--line-strong); border-radius:9px; padding:8px; background:var(--surface-2)}
.ord-slot .ph{color:var(--muted); font-size:13.5px; padding:4px}
.seq{display:inline-flex; align-items:center; gap:7px; background:var(--surface);
  border:1px solid var(--line); border-radius:7px; padding:5px 10px; font-size:13.5px}
.seq .sn{font-family:var(--mono); font-size:11px; color:var(--muted)}
.ord-slot.ok{border-color:var(--ok); border-style:solid; background:var(--ok-soft)}
.ord-slot.no{border-color:var(--no); border-style:solid; background:var(--no-soft)}

/* match / classify */
.mt-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding-bottom:10px;
  border-bottom:1px dotted var(--line)}
.mt-row:last-of-type{border-bottom:0; padding-bottom:0}
.mt-left{flex:1 1 230px; font-size:14.5px; min-width:0}
.cl-item{border:1px solid var(--line); border-radius:9px; background:var(--surface-2);
  padding:12px 14px; display:flex; flex-direction:column; gap:9px}
.cl-q{font-size:14.5px}
.cl-q b{font-weight:600; color:var(--accent-ink)}
.cl-opts{display:flex; gap:6px; flex-wrap:wrap}
.cl-item.ok{border-color:var(--ok); background:var(--ok-soft)}
.cl-item.no{border-color:var(--no); background:var(--no-soft)}

/* cards */
.grp{display:flex; flex-direction:column; gap:10px}
.grp-h{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:9px}
.fc{position:relative; border:1px solid var(--line); background:var(--surface-2); border-radius:9px;
  padding:12px 13px; min-height:78px; text-align:left; display:flex; flex-direction:column; gap:6px;
  transition:border-color .15s, background .15s}
.fc:hover{border-color:var(--accent)}
.fc .term{font-weight:600; font-size:14.5px}
.fc .def{font-size:13.5px; color:var(--muted); line-height:1.5}
.fc .tap{font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.fc.known{border-color:var(--ok); background:var(--ok-soft)}
.fc-mark{position:absolute; top:8px; right:8px; border:1px solid var(--line-strong);
  background:var(--surface); border-radius:6px; font-size:11px; padding:2px 7px; line-height:1.5;
  font-family:var(--mono); color:var(--muted)}
.fc.known .fc-mark{border-color:var(--ok); color:var(--ok)}

/* clip */
.clip{border:1px solid var(--line); border-radius:11px; background:var(--surface); padding:17px 18px;
  display:flex; flex-direction:column; gap:13px}
.clip-h{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.clip-h h3{font-size:16.5px}
blockquote{margin:0; padding:12px 16px; background:var(--surface-2); border-left:3px solid var(--line-strong);
  border-radius:0 8px 8px 0; font-size:15px; font-family:var(--serif); line-height:1.65; max-width:64ch}

/* scale */
.sc-tbl{width:100%; border-collapse:collapse; font-size:14px}
.sc-wrap{overflow-x:auto}
.sc-tbl th{font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); font-weight:500; padding:0 8px 9px; text-align:center}
.sc-tbl th:first-child{text-align:left}
.sc-tbl td{border-top:1px solid var(--line); padding:9px 8px; text-align:center}
.sc-tbl td:first-child{text-align:left; min-width:190px}
.rad{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface-2); padding:0}
.rad[aria-pressed="true"]{background:var(--accent); border-color:var(--accent)}

/* nav */
.stepnav{display:flex; gap:10px; justify-content:space-between; align-items:center;
  border-top:1px solid var(--line); padding-top:18px; margin-top:6px}

/* modal */
.mask{position:fixed; inset:0; background:rgba(10,15,20,.55); z-index:60; display:grid; place-items:center; padding:20px}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow);
  width:min(680px,100%); max-height:86vh; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:14px}
.modal h3{font-size:19px}
.modal textarea{min-height:300px; font-family:var(--mono); font-size:12.5px; line-height:1.55}

.storewarn{
  max-width:1180px; margin:16px auto 0; padding:12px 16px;
  border:1px solid var(--accent); border-left-width:3px; border-radius:0 9px 9px 0;
  background:var(--accent-soft); color:var(--ink); font-size:14px; line-height:1.55;
}
@media (max-width:1220px){ .storewarn{margin-inline:20px} }
.hr{height:1px; background:var(--line); border:0; margin:2px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <b>Atelier Compte bancaire</b>
      <span>B1+ · banque &amp; démarches</span>
    </div>
    <div class="prog" title="Activités complétées">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <span class="prog-num" id="progNum">0 / 0</span>
    </div>
    <button class="btn" id="exportBtn">Exporter mes réponses</button>
    <button class="btn btn-ghost" id="themeBtn" aria-label="Changer de thème">Thème</button>
  </div>
</div>

<div class="shell">
  <aside class="rail">
    <div class="rail-head">Parcours · en autonomie</div>
    <ul class="rail-list" id="rail"></ul>
    <div class="rail-foot">
      <a class="tc" href="https://youtu.be/IGjqmLp_9O0" target="_blank" rel="noopener">Ouvrir la vidéo</a>
      <button class="btn btn-ghost small" id="resetBtn">Tout effacer</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
(function(){
"use strict";

var VIDEO = "https://youtu.be/IGjqmLp_9O0";
var KEY = "compte-bancaire-b1plus-v1";

/* ---------------- storage ---------------- */
var state = {step:0, a:{}, done:{}, known:{}};
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p = JSON.parse(raw); if(p && typeof p==="object"){
      state.step = p.step|0; state.a = p.a||{}; state.done = p.done||{}; state.known = p.known||{};
    }}
  }catch(e){}
}
var STORAGE_OK = (function(){
  try{ localStorage.setItem(KEY+"-probe","1"); localStorage.removeItem(KEY+"-probe"); return true; }
  catch(e){ return false; }
})();
var saveTimer=null;

/* ---------------- helpers ---------------- */
function el(tag, cls, txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function html(tag, cls, h){ var n=document.createElement(tag); if(cls)n.className=cls; if(h!=null)n.innerHTML=h; return n; }
function mmss(s){ var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }
function tcLink(sec, label){
  var a=el("a","tc",label||mmss(sec));
  a.href=VIDEO+"?t="+sec; a.target="_blank"; a.rel="noopener";
  a.title="Ouvrir la vidéo à "+mmss(sec);
  return a;
}
function norm(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]/g," ").replace(/\s+/g," ").trim();
}
function matches(val, answers){
  var v = norm(val); if(!v) return false;
  for(var i=0;i<answers.length;i++){ if(v === norm(answers[i])) return true; }
  return false;
}

{"t":"seg","n":3,"a":107,"b":173,"title":"Les trois pièces obligatoires",

 "obj":["Suivre une procédure décrite étape par étape.","Comprendre <em>coller à</em> (familier) et ses équivalents soignés.","Repérer <em>une fois que</em> + futur antérieur → futur."],

  {"type":"Préparer la classe","q":"Quelles trois questions poseriez-vous au conseiller pour choisir votre offre ?","hint":"Pensez à votre situation : salaire en France, famille ou comptes en Espagne, voyages.","starters":["Quels sont les frais de…","Est-ce que les virements vers…","Quel est le plafond de…"],"model":"« Quels sont les frais de tenue de compte et la cotisation annuelle de la carte ? Est-ce que les virements vers l'Espagne sont gratuits ? Quel est le plafond de paiement et de retrait de la carte ? »"}],

{"t":"seg","n":8,"a":363,"b":399,"title":"La convention de compte",
 "sum":"« Pour vous la faire très simple », la <strong>convention de compte</strong> est le document qui réunit la totalité des <strong>engagements</strong> entre la banque et le client : par exemple les conditions de <strong>procuration</strong>, les services proposés et leurs <strong>tarifs</strong>, la procédure en cas d'<strong>incident de paiement</strong>, etc. On signe ce document et on remet tous les justificatifs préparés à l'étape 2.",
 "obj":["Comprendre la définition d'un document contractuel.","Découvrir le lexique du contrat : <em>engagements</em>, <em>tarifs</em>, <em>procuration</em>, <em>incident de paiement</em>.","Savoir définir un document : <em>c'est le document qui… / dans lequel…</em>"],
 "qs":[
  {"type":"Compréhension","q":"Qu'est-ce qu'une convention de compte, et que contient-elle ?","starters":["C'est le document qui…","On y trouve, par exemple,…","On la signe et…"],"model":"« C'est le document qui réunit tous les engagements entre la banque et le client. On y trouve, par exemple, les conditions de procuration, les services et leurs tarifs, et la procédure en cas d'incident de paiement. On la signe et on remet en même temps tous ses justificatifs. »"},
  {"type":"Reformulation","q":"Expliquez avec vos mots : « une procuration » et « un incident de paiement ».","starters":["Une procuration, c'est…","Un incident de paiement, c'est quand…"],"model":"« Une procuration, c'est une autorisation donnée à une autre personne pour utiliser votre compte en votre nom. Un incident de paiement, c'est quand un paiement ne peut pas être effectué, par exemple un prélèvement rejeté ou un chèque sans provision. »"},
  {"type":"Préparer la classe","q":"Dans votre métier, quel document joue le même rôle avec un fournisseur ou un client ?","starters":["Chez nous, l'équivalent, ce serait…","C'est là que figurent…","En cas de litige,…"],"model":"« Chez nous, l'équivalent, ce serait le contrat-cadre ou les conditions générales de vente. C'est là que figurent les prix, les délais de paiement et les pénalités de retard. En cas de litige, c'est le premier document qu'on ressort. »"}],
 "tour":[
  ["pour vous la faire (très) simple","familier : pour simplifier","Pour vous la faire simple, on a deux mois de retard."],
  ["réunir la totalité de","rassembler l'ensemble de","Ce dossier réunit la totalité des pièces demandées."],
  ["en cas de + nom","si… se produit","En cas de retard de paiement, des pénalités s'appliquent."],
  ["les engagements entre X et Y","les obligations réciproques","Le contrat fixe les engagements entre le client et nous."]],
 "gram":{"t":"Définir : <em>c'est le document qui… / dans lequel… / où…</em>","h":"<p>« La convention, <strong>c'est le document qui</strong> réunit les engagements. » → <em>qui</em> = sujet.</p><p>« <strong>C'est le document dans lequel</strong> figurent les tarifs. » → après une préposition, <em>lequel / laquelle</em>.</p><p>En réunion : « Le contrat-cadre, c'est le document <strong>qui</strong> fixe les délais de paiement ; c'est <strong>là que</strong> figurent les pénalités de retard. »</p>"}},

  {"type":"Préparer la classe","q":"Vous arrivez à Paris en novembre et votre premier salaire sera versé fin novembre. Quel calendrier prévoyez-vous pour votre compte ?","starters":["Dès la première semaine,…","Ensuite, je transmettrai…","Pour ne pas prendre de retard,…"],"model":"« Dès la première semaine, je prendrai rendez-vous dans une agence près de chez moi ou du bureau. Ensuite, je transmettrai mon RIB au service RH pour que mon salaire soit versé sur le bon compte. Pour éviter tout retard, je garderai mon compte espagnol actif les premiers mois. »"}],

  ["grand maximum","familier : au maximum","Vous recevrez la carte en deux semaines, grand maximum."],

 "gram":{"t":"<em>attendre que</em> + subjonctif","h":"<p>« Il vous reste à attendre <strong>que</strong> votre compte <strong>soit</strong> ouvert et <strong>que</strong> votre carte <strong>arrive</strong>. »</p><p>Après <em>attendre que</em>, toujours le subjonctif. Si le sujet est le même : <em>attendre de</em> + infinitif (« J'attends <strong>de recevoir</strong> la facture »).</p><p>En réunion : « Nous attendons <strong>que</strong> le client <strong>ait</strong> signé le bon de commande. »</p>"}}

var LETTERS = "ABCDEFGHIJ";
function segCard(s, idx){
  var blocks = [];
  blocks.push({t:"callout", ct:"Objectifs pédagogiques du segment", h:"<ul style='margin:0;padding-left:18px'>"+s.obj.map(function(o){return "<li>"+o+"</li>";}).join("")+"</ul>"});
  var ex = EX[s.n];
  if(ex){
    if(ex.t==="gaps") blocks.push({t:"gaps", k:"x"+s.n, fields:ex.fields});
    else blocks.push({t:"tf", k:"x"+s.n, items:ex.items});
  }
  blocks.push({t:"reveal", label:"Vérifier avec le résumé du segment", rt:"Résumé — à lire après l'écoute, pas avant", h:"<p>"+s.sum+"</p>"});
  s.qs.forEach(function(q, i){
    blocks.push({t:"open", k:"s"+s.n+"_"+i, n:String(i+1), starters:q.starters,
      q:"<strong>"+q.type+".</strong> "+q.q, hint:q.hint, model:q.model});
  });
  blocks.push({t:"callout", ct:"Focus langue — tournures et constructions clés",
    h:"<ul style='margin:0;padding-left:18px'>"+s.tour.map(function(t){
        return "<li><strong>"+t[0]+"</strong> ("+t[1]+") — <em>« "+t[2]+" »</em></li>";}).join("")+"</ul>"+
      "<p><strong>Construction clé : "+s.gram.t+"</strong></p>"+s.gram.h});
  return {t:"card", h3:LETTERS[idx]+". Segment "+s.n+" — "+s.title,
    sub:(ex ? (ex.t==="gaps" ? "Écoutez le segment et repérez les chiffres et les mots-clés. Vérifiez avec le résumé, puis passez aux trois questions." : "Écoutez le segment : vrai ou faux ? Vérifiez avec le résumé, puis passez aux trois questions.") : ""),
    tc:[{sec:s.a, l:mmss(s.a)},{sec:s.b, l:mmss(s.b)}], blocks:blocks};
}

/* ---------------- activity registry ---------------- */
var ACTS = [];
function reg(k){ if(ACTS.indexOf(k)<0) ACTS.push(k); }
(function scan(){
  function walk(bs){
    bs.forEach(function(b){
      if(b.t==="open") reg(b.k);
      else if(b.t==="tf"||b.t==="order"||b.t==="match"||b.t==="classify"||b.t==="scale") reg(b.k);
      else if(b.t==="gaps") reg(b.k);
      else if(b.t==="clip"){ (b.ex||[]).forEach(function(x){ reg(x.k); }); }
      else if(b.t==="card"&&b.blocks) walk(b.blocks);
    });
  }
  STEPS.forEach(function(s){ walk(s.blocks); });
})();

function isDone(k){
  var v = state.a[k];
  if(v==null) return false;
  if(typeof v === "string") return v.trim().length>2;
  if(typeof v === "object") return Object.keys(v).length>0;
  return false;
}
function stepDone(s){
  var ks = stepKeys(s);
  if(!ks.length) return false;
  var n=0; ks.forEach(function(k){ if(isDone(k)) n++; });
  return n >= Math.ceil(ks.length*0.7);
}
function stepKeys(s){
  var out=[];
  function walk(bs){ bs.forEach(function(b){
    if(b.t==="open"||b.t==="tf"||b.t==="order"||b.t==="match"||b.t==="classify"||b.t==="scale"||b.t==="gaps"){ if(b.k) out.push(b.k); }
    else if(b.t==="clip"){ (b.ex||[]).forEach(function(x){ out.push(x.k); }); }
    else if(b.t==="card"&&b.blocks) walk(b.blocks);
  });}
  walk(s.blocks); return out;
}

function textOf(k){
  var v = state.a[k];
  if(v==null) return "";

function buildExport(){
  var L=[];
  L.push("ATELIER COMPTE BANCAIRE — préparation autonome B1+");
  L.push("Vidéo : « Comment ouvrir un compte bancaire »");
  L.push("Exporté le "+new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}));
  var n=0; ACTS.forEach(function(k){ if(isDone(k)) n++; });
  L.push("Avancement : "+n+" activités sur "+ACTS.length);
  L.push("");
  STEPS.forEach(function(s, si){
    var lines=[];
    function walk(bs){
      bs.forEach(function(b){
        if(b.t==="open"){
          var t = textOf(b.k);
          if(t) lines.push("• "+b.q.replace(/<[^>]+>/g,"")+"\n  → "+t);
        } else if(b.t==="clip"){
          (b.ex||[]).forEach(function(x){
            var t = textOf(x.k);
            if(t) lines.push("• "+x.q.replace(/<[^>]+>/g,"")+"\n  → "+t);
          });
        } else if(b.t==="scale"){
          var st = state.a[b.k]||{};
          b.rows.forEach(function(r,i){
            if(st[i]!=null) lines.push("• "+r+" : "+b.cols[st[i]]);
          });
        } else if(b.t==="card" && b.blocks){ walk(b.blocks); }
      });
    }
    walk(s.blocks);
    if(lines.length){
      L.push("──────────────────────────────");
      L.push(String(si+1).padStart(2,"0")+". "+s.title.toUpperCase());
      L.push("");
      L.push(lines.join("\n\n"));
      L.push("");
    }
  });
  if(L.length<=5) L.push("(Aucune réponse rédigée pour l'instant.)");
  return L.join("\n");
}
function openExport(){
  var mask = el("div","mask");
  var m = el("div","modal");
  m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Récapitulatif de mes réponses");
  m.appendChild(html("h3",null,"Mon récapitulatif"));
  m.appendChild(html("p","sub","Copiez ce texte et envoyez-le à votre formateur avant le cours."));
  var ta = el("textarea"); ta.id="exportArea"; ta.value = buildExport(); ta.readOnly = true;
  m.appendChild(ta);
  var row = el("div","row");
  var copy = el("button","btn btn-primary","Copier le texte");
  var status = el("span","small muted","");
  copy.addEventListener("click", function(){
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done=false;
    try{ done = document.execCommand("copy"); }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ status.textContent="Copié ✓"; status.style.color="var(--ok)"; },
        function(){ if(!done) status.textContent="Sélectionnez le texte puis Ctrl/Cmd + C."; });
    } else {
      status.textContent = done ? "Copié ✓" : "Sélectionnez le texte puis Ctrl/Cmd + C.";
      status.style.color = done ? "var(--ok)" : "var(--muted)";
    }
  });
  var close = el("button","btn","Fermer");
  function shut(){ mask.remove(); document.removeEventListener("keydown", esc); }
  function esc(e){ if(e.key==="Escape") shut(); }
  close.addEventListener("click", shut);
  mask.addEventListener("click", function(e){ if(e.target===mask) shut(); });
  document.addEventListener("keydown", esc);
  row.appendChild(copy); row.appendChild(close); row.appendChild(status);
  m.appendChild(row);
  mask.appendChild(m);
  document.body.appendChild(mask);
  copy.focus();
}

/* ---------------- theme ---------------- */
document.getElementById("themeBtn").addEventListener("click", function(){
  var r = document.documentElement;
  var cur = r.getAttribute("data-theme");
  var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var nowDark = cur ? cur==="dark" : sysDark;
  r.setAttribute("data-theme", nowDark ? "light" : "dark");
  try{ localStorage.setItem(KEY+"-theme", nowDark ? "light":"dark"); }catch(e){}
});
(function(){ var t=null; try{ t=localStorage.getItem(KEY+"-theme"); }catch(e){} document.documentElement.setAttribute("data-theme", t==="light" ? "light" : "dark"); })();

document.getElementById("exportBtn").addEventListener("click", openExport);
document.getElementById("resetBtn").addEventListener("click", function(){
  if(!window.confirm("Effacer toutes vos réponses ? Cette action est définitive.")) return;
  state = {step:0, a:{}, done:{}, known:{}};
  save(); renderStep(); renderRail(); updateProgress();
});

/* ---------------- boot ---------------- */
if(!STORAGE_OK){
  var warn = html("div","storewarn",
    "<strong>Ce navigateur n'enregistre pas vos réponses sur cette page.</strong> "+
    "Vous pouvez travailler normalement, mais <strong>avant de fermer l'onglet</strong>, "+
    "cliquez sur « Exporter mes réponses » en haut de la page et conservez le texte.");
  document.body.insertBefore(warn, document.querySelector(".shell"));
}
load();
if(state.step<0 || state.step>=STEPS.length) state.step=0;
renderStep();
renderRail();
updateProgress();
})();
