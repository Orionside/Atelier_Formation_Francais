<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Plug &amp; Charge</title>
<meta name="description" content="Séance Impact 60 — atelier d'expression orale B2 pour cadres : mesure, écoute ciblée, formules, prononciation, tâche en 3 tours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,600;0,700;1,500&display=swap">
<style>
/* ======================================================================
   SÉANCE IMPACT 60 — MOTEUR (ne pas modifier pour un nouvel atelier :
   tout le contenu est dans contenu.js)
   ====================================================================== */
:root{
  color-scheme:light;
  --paper:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F7F9;
  --ink:#131B24; --muted:#5B6B7A; --line:#D5DDE4; --line-strong:#B9C5CF;
  --accent:#8F5406; --accent-ink:#8F5406; --accent-soft:#F3E6D2; --on-accent:#FFFFFF;
  --ok:#186A42; --ok-soft:#DCEFE4; --no:#9E2A21; --no-soft:#F8E2DF;
  --rec:#B3261E;
  --focus:#1F5FA8;
  --shadow:0 1px 2px rgba(19,27,36,.06), 0 8px 24px -16px rgba(19,27,36,.28);
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E141A; --surface:#161E26; --surface-2:#1C262F;
    --ink:#E3EAF0; --muted:#94A4B3; --line:#2A3743; --line-strong:#3C4C5A;
    --accent:#E0A85C; --accent-ink:#E9BC7E; --accent-soft:#382915; --on-accent:#1A1206;
    --ok:#62C18E; --ok-soft:#15301F; --no:#EE9088; --no-soft:#331816;
    --rec:#F2877E;
    --focus:#82B6EB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E141A; --surface:#161E26; --surface-2:#1C262F;
  --ink:#E3EAF0; --muted:#94A4B3; --line:#2A3743; --line-strong:#3C4C5A;
  --accent:#E0A85C; --accent-ink:#E9BC7E; --accent-soft:#382915; --on-accent:#1A1206;
  --ok:#62C18E; --ok-soft:#15301F; --no:#EE9088; --no-soft:#331816;
  --rec:#F2877E;
  --focus:#82B6EB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif); font-weight:700; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit; cursor:pointer}
ul,ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}

/* ---------- barre du haut ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0; flex-wrap:wrap}
.brand b{font-family:var(--serif); font-size:17px; font-weight:700}
.brand span{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.prog{display:flex; align-items:center; gap:9px}
.prog-track{width:110px; height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.prog-fill{height:100%; width:0%; background:var(--accent); transition:width .35s ease}
.prog-num{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:7px; font-size:13.5px; font-weight:500; transition:background .15s, border-color .15s}
.btn:hover{background:var(--surface-2); border-color:var(--muted)}
.btn:disabled{opacity:.45; cursor:default}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08); background:var(--accent)}
.btn-ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.small{padding:5px 10px; font-size:12.5px}

/* ---------- mise en page ---------- */
.shell{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:26px 64px;
  display:grid; grid-template-columns:238px minmax(0,1fr); gap:38px; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr); gap:20px; padding-inline:16px} .topbar-in{padding-inline:16px} }

.rail{position:sticky; top:calc(env(safe-area-inset-top,0px) + 74px)}
.rail-head{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; padding-left:2px}
.rail-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.rl{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:8px 11px; color:var(--muted); font-size:13.5px; line-height:1.35; transition:background .15s, border-color .15s, color .15s}
.rl:hover{border-color:var(--line-strong); background:var(--surface-2); color:var(--ink)}
.rl[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:500; box-shadow:var(--shadow)}
.rl-num{font-family:var(--mono); font-size:11px; flex:0 0 auto; width:23px; height:23px; display:grid; place-items:center; border-radius:6px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--muted)}
.rl.is-done .rl-num{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.rl[aria-current="true"] .rl-num{background:rgba(255,255,255,.24); border-color:transparent; color:inherit}
.rl-title{min-width:0; flex:1}
.rl-time{font-family:var(--mono); font-size:10.5px; opacity:.8; white-space:nowrap}
.rail-foot{margin-top:18px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; align-items:flex-start}
@media (max-width:900px){
  .rail{position:static}
  .rail-list{flex-direction:row; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
  .rail-list li{flex:0 0 auto}
  .rl-title{white-space:nowrap}
  .rl-time{display:none}
  .rail-foot{display:none}
}

main{min-width:0}
.step{display:flex; flex-direction:column; gap:20px}
.step-head{border-bottom:1px solid var(--line); padding-bottom:16px; display:flex; flex-direction:column; gap:7px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); display:flex; gap:10px; flex-wrap:wrap}
.step-head h2{font-size:clamp(22px,4.3vw,29px); line-height:1.2}
.lede{color:var(--muted); max-width:62ch}

.card{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:18px 19px; display:flex; flex-direction:column; gap:13px}
.card h3{font-size:17px; line-height:1.3}
.card .sub{color:var(--muted); font-size:14px; margin-top:-6px}
.prose{max-width:66ch; display:flex; flex-direction:column; gap:10px}
.prose strong{font-weight:600}
.callout{border-left:3px solid var(--accent); background:var(--surface-2); border-radius:0 9px 9px 0; padding:14px 17px; display:flex; flex-direction:column; gap:8px; max-width:68ch}
.callout .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}
.lbl{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.hr{height:1px; background:var(--line); border:0; margin:2px 0}
blockquote{margin:0; padding:10px 14px; background:var(--surface-2); border-left:3px solid var(--line-strong);
  border-radius:0 8px 8px 0; font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.6; max-width:64ch}

.tc{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:3px 8px; color:var(--ink);
  text-decoration:none; white-space:nowrap; font-variant-numeric:tabular-nums}
.tc:hover{border-color:var(--accent); color:var(--accent-ink)}
.tc::before{content:"▶"; font-size:8px; color:var(--accent-ink)}

textarea, input[type="text"]{font:inherit; font-size:14.5px; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:9px 12px; line-height:1.5; width:100%}
textarea{min-height:70px; resize:vertical}
textarea:focus, input[type="text"]:focus{border-color:var(--focus); background:var(--surface)}
input.gap{width:150px; font-family:var(--mono); text-align:center; padding:6px 9px}
input.ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
input.no{border-color:var(--no); background:var(--no-soft); color:var(--no)}

/* profils et choix */
.pills{display:flex; gap:8px; flex-wrap:wrap}
.pill{border:1px solid var(--line-strong); background:var(--surface-2); border-radius:99px; padding:8px 16px; font-size:14px; font-weight:500}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line-strong); background:var(--surface-2); border-radius:7px; padding:5px 11px; font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}

/* phases (déroulé) */
.phases{list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.phase{border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--surface-2); display:flex; flex-direction:column; gap:2px}
.phase .pt{font-family:var(--mono); font-size:11px; color:var(--accent-ink)}
.phase .pn{font-weight:500; font-size:14px}

/* QCM */
.mcq{display:flex; flex-direction:column; gap:9px}
.mcq + .mcq{border-top:1px dashed var(--line); padding-top:14px}
.mcq-q{font-weight:500; max-width:64ch}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{text-align:left; border:1px solid var(--line-strong); background:var(--surface-2); border-radius:8px; padding:8px 12px; font-size:14.5px}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.no{border-color:var(--no); background:var(--no-soft)}
.opts.inline{flex-direction:row; flex-wrap:wrap}
.expl{font-size:14px; background:var(--surface-2); border-left:3px solid var(--ok); border-radius:0 8px 8px 0; padding:9px 13px; max-width:66ch}

.gap-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14.5px; border-bottom:1px dotted var(--line); padding-bottom:9px}
.gap-row:last-child{border-bottom:0; padding-bottom:0}
.gap-sol{font-family:var(--mono); font-size:12.5px; color:var(--ok)}

/* enregistreur */
.rec{border:1px solid var(--line-strong); border-radius:11px; background:var(--surface-2); padding:14px 15px; display:flex; flex-direction:column; gap:12px}
.rec-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.btn-rec{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--rec); color:var(--rec); background:var(--surface);
  border-radius:99px; padding:8px 16px; font-weight:600; font-size:14px}
.btn-rec::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--rec)}
.btn-rec.on::before{border-radius:2px; animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.rec-time{font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums}
.rec-bar{flex:1 1 120px; height:6px; border-radius:99px; background:var(--line); overflow:hidden; min-width:80px}
.rec-bar i{display:block; height:100%; width:0; background:var(--rec)}
.rec audio{width:100%; max-width:480px}
.rec-msg{font-size:13.5px; color:var(--muted)}
.rec-file{font-size:13px; color:var(--muted)}
.rec-file input{font-size:13px; max-width:100%}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px}
.tile{border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:9px 11px; display:flex; flex-direction:column; gap:1px}
.tile .v{font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px; color:var(--muted); line-height:1.35}

/* tableaux */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl th{font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:0 8px 8px; text-align:left}
.tbl td{border-top:1px solid var(--line); padding:8px; vertical-align:top}
.tbl td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.better{color:var(--ok); font-weight:600} .worse{color:var(--no); font-weight:600}

/* minuteur */
.timer{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.timer .tt{font-family:var(--mono); font-size:26px; font-variant-numeric:tabular-nums; min-width:78px}
.timer .tt.end{color:var(--rec)}

/* formules */
.seg{display:inline-flex; align-self:flex-start; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden}
.seg button{border:0; background:var(--surface); padding:7px 14px; font-size:13.5px; font-weight:500}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.fm-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
@media (max-width:420px){ .fm-grid{grid-template-columns:minmax(0,1fr)} }
.fm{border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:15px 16px; display:flex; flex-direction:column; gap:10px}
.fm.ok{border-color:var(--ok)}
.fm-fn{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent-ink)}
.fm-form{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.35}
.fm-ex{font-size:14.5px}
.fm-foot{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:auto}
.state-pill{font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line-strong); color:var(--muted)}
.state-pill.ok{border-color:var(--ok); color:var(--ok)}
.state-pill.no{border-color:var(--no); color:var(--no)}

/* prosodie */
.prosody{font-family:var(--serif); font-size:19px; line-height:1.9; max-width:60ch}
.prosody strong{color:var(--accent-ink); font-weight:700; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px}
.model{display:flex; flex-direction:column; gap:8px; padding-bottom:14px; border-bottom:1px dashed var(--line)}
.model:last-child{border-bottom:0; padding-bottom:0}

.checks{list-style:none; padding:0; display:flex; flex-direction:column; gap:7px}
.checks label{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; cursor:pointer}
.checks input{margin-top:4px; width:16px; height:16px; accent-color:var(--accent); flex:0 0 auto}
ol.seqlist{gap:8px}

.objection{border:1px dashed var(--accent); border-radius:9px; padding:12px 14px; font-family:var(--serif); font-style:italic; font-size:16px; background:var(--accent-soft)}

.stepnav{display:flex; gap:10px; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:18px; margin-top:6px}

.mask{position:fixed; inset:0; background:rgba(10,15,20,.55); z-index:60; display:grid; place-items:center; padding:16px}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow);
  width:min(680px,100%); max-height:86vh; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:14px}
.modal h3{font-size:19px}
.modal textarea{min-height:300px; font-family:var(--mono); font-size:12.5px}
.storewarn{max-width:1180px; margin:16px auto 0; padding:12px 16px; border:1px solid var(--accent); border-left-width:3px;
  border-radius:0 9px 9px 0; background:var(--accent-soft); font-size:14px}
@media (max-width:1220px){ .storewarn{margin-inline:16px} }

/* voix : lecteur du film, fichiers audio */
.listen{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
/* ---------- v6 : lisibilité pour l'apprenant ---------- */
body{font-size:16.5px}
.lede{font-size:17px; color:var(--ink); opacity:.85}
.listen-wrap{display:flex; flex-direction:column; gap:6px}
.listen-go{display:inline-flex; align-items:center; gap:8px; border:0; border-radius:99px; padding:9px 18px;
  background:var(--focus); color:#fff; font-weight:600; font-size:15px; box-shadow:var(--shadow)}
:root[data-theme="dark"] .listen-go, :root:not([data-theme="light"]) .listen-go{color:#0E141A}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .listen-go{color:#fff}}
.listen-go:hover{filter:brightness(1.08)}
.listen-go.on{background:var(--rec)}
.listen .chip{padding:6px 12px; font-size:13.5px; border-radius:99px}
.listen-tag{font-size:12.5px; color:var(--muted); font-style:italic}
.linkbtn{border:0; background:none; padding:0; color:var(--muted); text-decoration:underline; font-size:13.5px; align-self:flex-start}
.sub-h{display:flex; align-items:center; gap:10px; margin:10px 0 0; font-family:var(--sans); font-size:18px; font-weight:600; color:var(--ink)}
.sub-n{flex:0 0 auto; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); font-size:14px; font-weight:700}
.why{background:var(--accent-soft); border-radius:9px; padding:10px 14px; font-size:15px; max-width:68ch}
.note{font-size:14.5px; color:var(--muted); max-width:68ch}
.consigne{font-size:16.5px; font-weight:500; max-width:64ch}
.field-l{font-weight:600; font-size:15px; margin-top:6px}
/* situation */
.scene{border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:10px; max-width:720px}
.scene-tag{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}
.scene-row{display:grid; grid-template-columns:120px minmax(0,1fr); gap:12px; align-items:baseline}
@media (max-width:520px){ .scene-row{grid-template-columns:minmax(0,1fr); gap:2px} }
.scene-k{font-size:13.5px; font-weight:600; color:var(--muted)}
.scene-v{font-size:16.5px}
.scene-quote{margin:0; padding:12px 16px; border-left:4px solid var(--accent); background:var(--surface-2); border-radius:0 9px 9px 0; font-family:var(--serif); font-size:19px; font-style:italic; line-height:1.45}
.scene-go{font-weight:500}
.perso{display:flex; flex-direction:column; gap:8px; border-top:1px dashed var(--line); padding-top:12px}
.perso-q{font-size:15px}
.perso input[type="text"]{max-width:560px}
/* plan */
.plan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.plan-box{border:1px solid var(--line); border-radius:10px; background:var(--surface-2); padding:12px; display:flex; flex-direction:column; gap:8px}
.plan-h{display:flex; align-items:center; gap:8px; font-weight:600}
.plan-n{width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--surface); display:grid; place-items:center; font-size:13px}
.plan-aide{font-size:14px; color:var(--muted)}
.plan-aide em{color:var(--accent-ink); font-style:normal; font-weight:600}
/* programme */
.programme{list-style:none; padding:0; display:flex; flex-direction:column; gap:0}
.programme li{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
.programme li:last-child{border-bottom:0}
.pg-n{width:28px; height:28px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line-strong); display:grid; place-items:center; font-weight:600; font-size:14px}
.pg-t{display:flex; flex-direction:column}
.pg-d{font-size:14px; color:var(--muted)}
.pg-time{font-family:var(--mono); font-size:13px; color:var(--accent-ink); white-space:nowrap}
/* écoute */
.gaps{display:flex; flex-direction:column; gap:12px}
.gap-row{display:flex; flex-direction:column; gap:3px; border:0; padding:0}
.gap-line{font-size:16px; line-height:2}
.gap-aide{font-size:13.5px; color:var(--muted)}
.gap-sol{font-size:14px; color:var(--ok); font-weight:600}
.mcq-q{font-size:16.5px}
.opt{font-size:15.5px; padding:10px 14px}
.chip.big{font-size:14.5px; padding:8px 14px; border-radius:99px}
/* phrases utiles */
.pc-list{display:flex; flex-direction:column; gap:16px}
.pc{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:14px}
.pc.ok{border-color:var(--ok)}
.pc-head{display:flex; align-items:center; gap:10px}
.pc-num{width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700}
.pc-sert{font-size:15px; font-weight:600; color:var(--accent-ink)}
.pc-forme{font-family:var(--serif); font-size:clamp(22px,3.4vw,27px); font-weight:700; line-height:1.3}
.pc-block{display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px}
.pc-lbl{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pc-film{font-family:var(--serif); font-size:17px; line-height:1.55; max-width:70ch}
.pc-film strong{color:var(--accent-ink); background:var(--accent-soft); padding:0 3px; border-radius:3px}
.pc-ex{font-size:16.5px; max-width:70ch}
.pc-avous{font-size:15px; color:var(--muted)}
.pc-foot{display:flex; gap:8px; flex-wrap:wrap}
.btn-ok{border-color:var(--ok); color:var(--ok); background:var(--ok-soft)}
.btn-no{color:var(--no)}
.pc-hidden{display:flex; flex-direction:column; gap:8px}
/* mélodie */
.regle{display:flex; flex-direction:column; gap:6px; font-size:16.5px}
.attention{background:var(--accent-soft); border-radius:9px; padding:10px 14px; font-size:15.5px; max-width:68ch}
.syl-box{border:1px solid var(--line); border-radius:12px; background:var(--surface-2); padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.syl-box + .syl-box{margin-top:6px}
.syl-title{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink)}
.syl-consigne{font-weight:600; font-size:16px}
.syl-sentence{font-family:var(--serif); font-size:clamp(20px,3vw,24px); line-height:1.4; display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.syl-word{display:inline-flex; align-items:center; gap:2px}
.syl{font:inherit; border:1px solid var(--line-strong); background:var(--surface); border-radius:6px; padding:0 5px; line-height:1.4; color:var(--ink)}
.syl:hover{border-color:var(--focus)}
.syl.sel{background:var(--focus); color:#fff; border-color:var(--focus)}
.syl.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:700}
.syl.no{background:var(--no-soft); border-color:var(--no); color:var(--no); text-decoration:line-through}
.syl.miss{border:2px dashed var(--ok)}
.syl-punct{padding-left:1px; line-height:1.4}
.mini-steps{display:flex; flex-direction:column; gap:4px; font-size:15.5px}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; background:var(--surface-2); border-radius:10px; padding:10px 14px; font-size:14px}
.legend-t{font-weight:600}
.legend-i{display:inline-flex; align-items:center; gap:6px}
.legend-s{font-size:18px; line-height:1.4}
.model{display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px dashed var(--line)}
.model-n{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.prosody{font-size:clamp(20px,3vw,23px); line-height:2.1}
.gsep{color:var(--line-strong); margin:0 .3em; font-weight:300}
.ench{color:var(--muted); font-weight:700}
.liai{display:inline-flex; flex-direction:column; align-items:center; line-height:.85; vertical-align:-.1em; margin:0 -3px; color:var(--focus)}
.liai-l{font-family:var(--sans); font-size:.5em; font-weight:700}
.liai-a{font-weight:700}
.mel-info{font-size:15px}
.tile .h{font-size:12px; color:var(--muted); font-style:italic}
.tbl-h{font-size:12.5px; color:var(--muted); font-weight:400}
.ajout{border-left:4px solid var(--focus); background:var(--surface-2); border-radius:0 9px 9px 0; padding:10px 14px; font-size:15.5px; display:flex; flex-direction:column; gap:4px; max-width:68ch}
.ajout-t{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--focus)}
.links{display:flex; flex-direction:column; gap:6px}
input[type="text"]{font-size:15.5px}

.listen-alt{margin-left:4px}
.float-player{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:50; width:min(380px, calc(100vw - 32px));
  background:var(--surface); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.fp-bar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px 6px 12px; border-bottom:1px solid var(--line)}
.fp-lbl{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.fp-video{aspect-ratio:16/9; min-height:200px; max-width:100%; background:#000}
.fp-video iframe, .fp-video > div{width:100%; height:100%; display:block; border:0}
/* mélodie */
.mel{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--surface-2)}
.mel-svg{width:100%; height:auto; max-width:100%; display:block}
.mel-grid{stroke:var(--line); stroke-width:1}
.mel-zero{stroke:var(--line-strong); stroke-width:1; stroke-dasharray:4 4}
.mel-lbl{fill:var(--muted); font-family:var(--mono); font-size:11px}
.mel-model{fill:none; stroke:var(--accent); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round}
.mel-mine{fill:none; stroke:var(--focus); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round}
.mel-legend{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.mel-legend .k{display:inline-block; width:18px; height:4px; border-radius:2px; vertical-align:middle}
.k-model{background:var(--accent)} .k-mine{background:var(--focus)}
.mel .rec{background:var(--surface)}
[hidden]{display:none!important}
.alerte{border-left:4px solid var(--rec); background:var(--no-soft); color:var(--ink); border-radius:0 9px 9px 0; padding:10px 14px; font-size:15px; max-width:68ch}
.alerte a{color:var(--ink); font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

  <div class="topbar-in">
    <div class="brand"><b id="brandTitle">Séance Impact 60</b><span id="brandSub">B2 · expression orale</span></div>

</div>

    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="contenu.js"></script>
<script>
(function(){
"use strict";

var C = window.IMPACT60;
var main = document.getElementById("main");
if(!C){
  main.innerHTML = "<div class='callout'><span class='ct'>Contenu introuvable</span><p>Le fichier <strong>contenu.js</strong> doit se trouver dans le même dossier que cette page.</p></div>";
  return;
}
var M = C.meta, VIDEO = M.video.url;
var KEY = "impact60-" + M.id, THEME_KEY = "impact60-theme";
var SUP = Object.assign({le:"le film", du:"du film", dans:"dans le film", Le:"Le film"}, M.support || {});

/* ---------------- stockage ---------------- */
var state = {step:0, a:{}, m:{}, fs:{}, done:{}, plan:{}};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
var STORAGE_OK = lsSet(KEY+"-probe","1");
try{ localStorage.removeItem(KEY+"-probe"); }catch(e){}
(function load(){
  var raw = lsGet(KEY); if(!raw) return;
  try{ var p = JSON.parse(raw); if(p && typeof p === "object"){ for(var k in state){ if(p[k] != null) state[k] = p[k]; } } }catch(e){}
})();
var saveTimer = null;
function save(){ lsSet(KEY, JSON.stringify(state)); }
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

/* ---------------- outils ---------------- */
function el(tag, cls, txt){ var n = document.createElement(tag); if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; }
function html(tag, cls, h){ var n = document.createElement(tag); if(cls) n.className = cls; if(h != null) n.innerHTML = h; return n; }
function dureeTxt(s){ s = Math.round(s); var m = Math.floor(s/60), r = s%60; return m ? m + " min" + (r ? " " + (r<10?"0":"") + r : "") : r + " s"; }
function mmss(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60), r = s%60; return m+":"+(r<10?"0":"")+r; }
function tcLink(a, b){
  var x = el("a", "tc", b ? mmss(a)+" → "+mmss(b) : mmss(a));
  x.href = VIDEO + (VIDEO.indexOf("?")>-1 ? "&" : "?") + "t=" + a; x.target = "_blank"; x.rel = "noopener";
  x.title = "Ouvrir la vidéo à " + mmss(a);
  return x;
}
function norm(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g," ").replace(/\s+/g," ").trim(); }
function card(title, sub){ var c = el("div","card"); if(title) c.appendChild(el("h3",null,title)); if(sub) c.appendChild(el("p","sub",sub)); return c; }
function callout(label, h){ var c = el("div","callout"); c.appendChild(el("span","ct",label)); c.appendChild(html("div","prose",h)); return c; }
function fmt(n, d){ return (n == null || isNaN(n)) ? "—" : n.toFixed(d == null ? 1 : d).replace(".", ","); }

/* ---------------- thème ---------------- */
var root = document.documentElement;
var savedTheme = lsGet(THEME_KEY);
if(savedTheme === "light" || savedTheme === "dark") root.setAttribute("data-theme", savedTheme);
document.getElementById("themeBtn").addEventListener("click", function(){
  var cur = root.getAttribute("data-theme");
  if(!cur) cur = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  var next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next); lsSet(THEME_KEY, next);
});

/* ================= voix authentiques =================
   1. Le film : lecteur YouTube officiel, calé sur la phrase (début/fin au centième),
      en boucle et un peu plus lentement (0,9) si YouTube le permet. Aucun extrait n'est copié.
   2. Les exemples métier : fichiers audio (voix du formateur, sinon voix neuronale).
   Plus de voix de synthèse du navigateur : trop robotique pour servir de modèle. */
var VIDEO_ID = (VIDEO.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/) || [])[1];
var YT_STATE = {player:null, ready:false, failed:false, waiters:[], seg:null, loop:false, rate:1, poll:null, owner:null};
var floatBox = null;
function ensureFloat(){
  if(floatBox) return floatBox;
  floatBox = el("div","float-player"); floatBox.hidden = true;
  var bar = el("div","fp-bar");
  var lbl = el("span","fp-lbl","Lecteur " + SUP.du);
  var close = el("button","btn btn-ghost small","Fermer"); close.type = "button";
  close.addEventListener("click", function(){ ytStop(); floatBox.hidden = true; });
  bar.appendChild(lbl); bar.appendChild(close);
  var slot = el("div","fp-video"); slot.id = "ytSlot";
  floatBox.appendChild(bar); floatBox.appendChild(slot);
  document.body.appendChild(floatBox);
  return floatBox;
}
function ytLoad(cb){
  if(YT_STATE.ready) return cb(true);
  if(YT_STATE.failed || !VIDEO_ID) return cb(false);
  YT_STATE.waiters.push(cb);
  if(YT_STATE.waiters.length > 1) return;
  ensureFloat().hidden = false;
  var done = function(ok){ var w = YT_STATE.waiters; YT_STATE.waiters = []; w.forEach(function(f){ f(ok); }); };
  var timeout = setTimeout(function(){ if(!YT_STATE.ready){ YT_STATE.failed = true; done(false); } }, 8000);
  window.onYouTubeIframeAPIReady = function(){
    try{
      YT_STATE.player = new YT.Player("ytSlot", {
        videoId: VIDEO_ID, width: "100%", height: "100%",
        playerVars: {playsinline:1, rel:0, modestbranding:1, controls:1, cc_load_policy:0, iv_load_policy:3, origin: location.origin},
        events: {
          onReady: function(e){
            clearTimeout(timeout); YT_STATE.ready = true;
            /* pas de sous-titres automatiques : ils dévoileraient le texte des exercices d'écoute */
            try{ e.target.unloadModule("captions"); e.target.unloadModule("cc"); }catch(er){}
            done(true);
          },
          onError: function(){ clearTimeout(timeout); YT_STATE.failed = true; done(false); }
        }
      });
    }catch(e){ clearTimeout(timeout); YT_STATE.failed = true; done(false); }
  };
  var sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api";
  sc.onerror = function(){ clearTimeout(timeout); YT_STATE.failed = true; done(false); };
  document.head.appendChild(sc);
}
function ytStop(){
  clearInterval(YT_STATE.poll); YT_STATE.poll = null;
  try{ if(YT_STATE.player){ YT_STATE.player.pauseVideo(); YT_STATE.player.setVolume(100); } }catch(e){}
  if(YT_STATE.owner) YT_STATE.owner(false); YT_STATE.owner = null;
}
function ytPlay(a, b, loop, rate, owner, onFail){
  ytStop();
  YT_STATE.seg = [a, b]; YT_STATE.loop = loop; YT_STATE.owner = owner;
  var p = YT_STATE.player;
  ensureFloat().hidden = false;
  /* On ne se fie pas à la position seule : juste après seekTo, YouTube renvoie la position
     demandée même si la vidéo n'a pas démarré. La lecture n'est « commencée » que si le
     lecteur est en état LECTURE (1) ET que le temps avance réellement.
     Volume à 0 jusqu'au début exact de la phrase (pas de mute/unMute : Chrome peut mettre
     en pause une vidéo dont le son est réactivé par script). */
  var entendu = false, t0 = 0, relance = false, tPrec = -1, tBouge = 0;
  function depart(){
    entendu = false; relance = false; t0 = Date.now(); tPrec = -1; tBouge = Date.now();
    try{ p.unMute(); p.setVolume(0); p.setPlaybackRate(rate); p.seekTo(a, true); p.playVideo(); }catch(e){}
  }
  function echec(){ ytStop(); if(onFail) onFail(); }
  depart();
  owner(true);
  YT_STATE.poll = setInterval(function(){
    var t = 0, st = -1;
    try{ t = p.getCurrentTime(); st = p.getPlayerState(); }catch(e){}
    var maintenant = Date.now();
    if(Math.abs(t - tPrec) > 0.01){ tBouge = maintenant; tPrec = t; }
    var joue = (st === 1) && (maintenant - tBouge < 700);
    if(!entendu){
      if(joue && t >= a - 0.03 && t < b){ try{ p.setVolume(100); }catch(e){} entendu = true; return; }
      if(!relance && maintenant - t0 > 2500){ relance = true; try{ p.seekTo(a, true); p.playVideo(); }catch(e){} }
      if(maintenant - t0 > 7000) echec();          /* la vidéo ne démarre pas : on le dit */
      return;
    }
    if(t >= b){ if(YT_STATE.loop) depart(); else ytStop(); return; }
    if(st === 2){ clearInterval(YT_STATE.poll); YT_STATE.poll = null; try{ p.setVolume(100); }catch(e){}   /* mise en pause dans le lecteur */
      if(YT_STATE.owner) YT_STATE.owner(false); YT_STATE.owner = null; return; }
    if(t < a - 1.5){ clearInterval(YT_STATE.poll); YT_STATE.poll = null;   /* l'utilisateur a déplacé la lecture */
      if(YT_STATE.owner) YT_STATE.owner(false); YT_STATE.owner = null; return; }
    if(maintenant - tBouge > 5000) echec();        /* lecture figée (réseau) */
  }, 30);
}
/* Barre d'écoute commune au film et aux fichiers audio */
/* Vitesse lente : 0,9× au plus bas (en dessous, la voix devient artificielle).
   Pour le film, on n'affiche le bouton que si YouTube propose une vitesse entre 0,85 et 0,95. */
var SLOW = 0.9;
function listenBar(label, play, stop, o){
  o = o || {};
  var w = el("div","listen");
  var go = el("button","listen-go", "▶ " + label); go.type = "button";
  var slow = el("button","chip","Un peu plus lent"); slow.type = "button"; slow.setAttribute("aria-pressed","false");
  slow.title = "Vitesse 0,9";
  var loop = el("button","chip","En boucle"); loop.type = "button"; loop.setAttribute("aria-pressed","false");
  if(o.slowHidden) slow.hidden = true;
  var playing = false;
  function owner(on){
    playing = !!on;
    go.textContent = on === "wait" ? "… Chargement" : on ? "■ Arrêter" : "▶ " + label;
    go.classList.toggle("on", !!on);
  }
  function opts(){ return {slow: slow.getAttribute("aria-pressed") === "true", loop: loop.getAttribute("aria-pressed") === "true"}; }
  go.addEventListener("click", function(){ if(playing){ stop(); owner(false); } else play(opts(), owner, slow); });
  [slow, loop].forEach(function(b){ b.addEventListener("click", function(){
    b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    if(playing){ stop(); play(opts(), owner, slow); }
  }); });
  w.appendChild(go); w.appendChild(slow); w.appendChild(loop);
  if(o.tag) w.appendChild(el("span","listen-tag", o.tag));
  return w;
}
function ytSlowRate(){
  if(YT_STATE.slowRate !== undefined) return YT_STATE.slowRate;
  var r = null;
  try{ (YT_STATE.player.getAvailablePlaybackRates() || []).forEach(function(x){ if(x >= 0.85 && x < 1 && (r === null || Math.abs(x-SLOW) < Math.abs(r-SLOW))) r = x; }); }catch(e){}
  YT_STATE.slowRate = r;
  return r;
}
function filmClip(a, b, label){
  var msg = el("p","alerte",""); msg.hidden = true;
  var lien = VIDEO + (VIDEO.indexOf("?") > -1 ? "&" : "?") + "t=" + Math.floor(a);
  function echec(texte, suite){
    var ouvrir = (suite ? "ouvrez " : "Ouvrez ") + SUP.le + " à " + mmss(a);
    msg.innerHTML = texte + " <a href='" + lien + "' target='_blank' rel='noopener'>" + ouvrir + "</a>.";
    msg.hidden = false;
  }
  var w = listenBar(label || "Écouter " + SUP.dans, function(o, owner, slowBtn){
    msg.hidden = true;
    owner("wait");
    ytLoad(function(ok){
      if(!ok){ owner(false); echec("Le lecteur ne s'ouvre pas ici."); return; }
      var r = ytSlowRate();
      slowBtn.hidden = !r;
      ytPlay(a, b, o.loop, (o.slow && r) ? r : 1, owner, function(){ echec("La vidéo ne démarre pas. Cliquez sur ▶ dans le lecteur (en bas à droite), ou", true); });
    });
  }, function(){ ytStop(); }, {slowHidden: !(YT_STATE.ready && ytSlowRate())});
  var box = el("div","listen-wrap"); box.appendChild(w); box.appendChild(msg);
  return box;
}
var AUDIO_EL = new Audio(); var audioOwner = null;
function audioStop(){ try{ AUDIO_EL.pause(); }catch(e){} if(audioOwner) audioOwner(false); audioOwner = null; }
AUDIO_EL.addEventListener("ended", function(){ if(audioOwner) audioOwner(false); audioOwner = null; });
function fileClip(src, label, tag){
  return listenBar(label, function(o, owner){
    audioStop(); ytStop();
    AUDIO_EL.src = src; AUDIO_EL.loop = o.loop; AUDIO_EL.playbackRate = o.slow ? SLOW : 1;
    try{ AUDIO_EL.preservesPitch = true; AUDIO_EL.webkitPreservesPitch = true; }catch(e){}
    audioOwner = owner; owner(true);
    var pr = AUDIO_EL.play(); if(pr && pr.catch) pr.catch(function(){ owner(false); });
  }, audioStop, {tag: tag});
}
/* Exemples « au travail » : la voix du formateur si le fichier existe, sinon une voix de synthèse
   de qualité ; sans fichier, rien ne s'affiche. Fichiers : audio/formateur/p1.mp3, audio/neuronal/p1.mp3… */
var VOIX = C.voix || {};
var DOSSIERS = VOIX.dossiers || {formateur:"audio/formateur/", neuronale:"audio/neuronal/"};
function probe(src){
  return new Promise(function(res){
    var a = new Audio(); var t = setTimeout(function(){ res(false); }, 6000);
    a.preload = "metadata";
    a.addEventListener("loadedmetadata", function(){ clearTimeout(t); res(true); });
    a.addEventListener("error", function(){ clearTimeout(t); res(false); });
    a.src = src;
  });
}
function voiceSlot(fid, label){
  var slot = el("div"); slot.style.display = "contents";
  var nom = fid + ".mp3";
  var cands = [[DOSSIERS.formateur + nom, "voix du formateur"], [DOSSIERS.neuronale + nom, "voix de synthèse"]];
  (function next(i){

/* ================= analyse audio (dans le navigateur) =================
   Même méthode que le script mesure_oral.py : énergie par trames de 10 ms,
   seuil adaptatif, pause = silence de 0,25 s ou plus (De Jong & Bosker 2013). */
var PAUSE_MIN = 0.25, LONG_PAUSE = 1.0;
function analyseSamples(data, sr){
  var hop = Math.round(sr*0.01), n = Math.floor(data.length/hop);
  if(n < 50) return null;

  for(var i=0;i<n;i++){
    var s = 0, o = i*hop;
    for(var j=0;j<hop;j++){ var v = data[o+j]; s += v*v; }
    db[i] = 10*Math.log10(s/hop + 1e-12);

  /* on ignore le silence numérique parfait (zéros) pour estimer le bruit de fond */
  var sorted = Array.prototype.filter.call(db, function(v){ return v > -100; }).sort(function(a,b){ return a-b; });
  if(sorted.length < 50) return {vide:true};
  var floor = sorted[Math.floor(sorted.length*0.10)], peak = sorted[Math.floor(sorted.length*0.95)];
  var dyn = peak - floor;
  var thr = floor + Math.max(6, dyn*0.35);

  for(i=0;i<n;i++) voiced[i] = db[i] > thr ? 1 : 0;

  function runs(){ var r = [], st = 0; for(var k=1;k<=n;k++){ if(k===n || voiced[k] !== voiced[st]){ r.push({v:voiced[st], a:st, b:k}); st = k; } } return r; }

  runs().forEach(function(r){ if(r.v===1 && (r.b-r.a) < 8) for(var k=r.a;k<r.b;k++) voiced[k] = 0; });
  runs().forEach(function(r){ if(r.v===0 && (r.b-r.a) < PAUSE_MIN*100 && r.a>0 && r.b<n) for(var k=r.a;k<r.b;k++) voiced[k] = 1; });

  var first = -1, last = -1;

  var pauses = [], speech = 0;
  rr.forEach(function(r){

    var d = (r.b-r.a)/100;

    iv = setInterval(function(){

/* texte de prosodie : ‿ enchaînement ; [z] [n] [t] liaison avec le son ajouté ; | fin de groupe */
function prosodyHtml(t){
  return t.replace(/\|/g, '<span class="gsep" aria-hidden="true">|</span>')
          .replace(/‿/g, '<span class="ench" title="On enchaîne sans pause">‿</span>')
          .replace(/\[(\w)\]/g, '<span class="liai" title="On ajoute le son « $1 »"><span class="liai-l">$1</span><span class="liai-a">‿</span></span>');

/* Exercice : cliquer sur les syllabes. « · » sépare les syllabes, « * » marque la bonne réponse. */
function sylQuiz(key, it){
  var box = el("div","syl-box");
  box.appendChild(el("span","syl-title", it.titre));
  box.appendChild(html("p","syl-consigne", it.consigne));
  var sent = el("p","syl-sentence"), btns = [], targets = [];
  var words = it.phrase.split(" ");
  words.forEach(function(w, wi){
    var m = w.match(/^(.*?)([.,;:!?]*)$/), span = el("span","syl-word");
    m[1].split("·").forEach(function(sy){
      var star = sy.charAt(0) === "*", t = star ? sy.slice(1) : sy;
      var b = el("button","syl",t); b.type = "button";
      if(star) targets.push(btns.length);
      (function(i){ b.addEventListener("click", function(){ pick(i); }); })(btns.length);
      btns.push(b); span.appendChild(b);
    });
    if(m[2]) span.appendChild(el("span","syl-punct",m[2]));
    sent.appendChild(span);
    if(wi < words.length-1) sent.appendChild(document.createTextNode(" "));
  });
  box.appendChild(sent);
  var multi = targets.length > 1;
  var st = state.a[key] || (state.a[key] = {sel:[], done:false});
  var ex = html("div","expl", it.explication); ex.hidden = true;
  var check = el("button","btn small","Vérifier"); check.type = "button"; check.hidden = !multi;
  check.addEventListener("click", function(){ st.done = true; save(); paint(); });
  function pick(i){
    if(multi){ var k = st.sel.indexOf(i); if(k > -1) st.sel.splice(k,1); else st.sel.push(i); st.done = false; }
    else { st.sel = [i]; st.done = true; }
    save(); paint();
  }
  function paint(){
    btns.forEach(function(b, i){
      b.className = "syl";
      var sel = st.sel.indexOf(i) > -1, tgt = targets.indexOf(i) > -1;
      if(!st.done){ if(sel) b.classList.add("sel"); return; }
      if(sel && tgt) b.classList.add("ok"); else if(sel) b.classList.add("no"); else if(tgt) b.classList.add("miss");
    });
    ex.hidden = !st.done;
  }
  var row = el("div","row"); row.appendChild(check);
  box.appendChild(row);
  box.appendChild(filmClip(it.debut, it.fin, "Écouter pour vérifier"));
  box.appendChild(ex);
  paint();
  return box;
}

}

/* ================= navigation ================= */
var railEl = document.getElementById("rail");
function refreshProgress(){
  var n = COUNTED.filter(function(s){ return state.done[s.id]; }).length;
  document.getElementById("progFill").style.width = (n/COUNTED.length*100) + "%";
  document.getElementById("progNum").textContent = n + " / " + COUNTED.length;
}
function renderRail(){
  railEl.innerHTML = "";
  var k = 0;
  STEPS.forEach(function(st, i){
    var li = el("li"), b = el("button","rl" + (state.done[st.id] ? " is-done" : "")); b.type = "button";
    if(i === state.step) b.setAttribute("aria-current","true");
    var num = st.count === false ? (i === 0 ? "·" : "F") : String(++k);
    b.appendChild(el("span","rl-num", state.done[st.id] ? "✓" : num));
    b.appendChild(el("span","rl-title",st.t));
    if(st.time) b.appendChild(el("span","rl-time",st.time));
    b.addEventListener("click", function(){ go(i); });
    li.appendChild(b); railEl.appendChild(li);
  });
}
function go(i){ state.step = Math.max(0, Math.min(STEPS.length-1, i)); save(); render(); window.scrollTo(0,0); }
function render(){
  ytStop(); audioStop();
  var st = STEPS[state.step] || STEPS[0];
  main.innerHTML = "";
  var s = el("section","step");
  R[st.id](s);
  var nav = el("div","stepnav");
  var prev = el("button","btn btn-ghost","← Retour"); prev.type = "button"; prev.disabled = state.step === 0;
  prev.addEventListener("click", function(){ go(state.step-1); });
  var nextLabel = st.id === "start" ? "Commencer →" : st.id === "form" ? "Revenir au début" : st.id === "objectif" ? "Terminer le cours ✓" : "Étape suivante →";
  var next = el("button","btn btn-primary", nextLabel); next.type = "button";
  next.addEventListener("click", function(){
    if(st.count !== false) state.done[st.id] = true;
    go(st.id === "form" ? 0 : state.step+1);
  });
  nav.appendChild(prev); nav.appendChild(next); s.appendChild(nav);
  main.appendChild(s);
  espacesFr(main);
  renderRail(); refreshProgress();
}

/* Typographie française : pas de guillemet ni de ponctuation haute seuls en début ou fin de ligne */
function espacesFr(root){
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  while((n = w.nextNode())){
    var t = n.nodeValue, u = t.replace(/« /g, "«\u00a0").replace(/ »/g, "\u00a0»").replace(/ ([:;?!])/g, "\u00a0$1");
    if(u !== t) n.nodeValue = u;
  }
}

/* ================= export ================= */
function buildExport(){
  var L = [];
  L.push("COURS · " + M.titreSeance + " (" + M.niveau + ")");
  L.push("Copié le " + new Date().toLocaleString("fr-FR"));
  if(sujetPerso()) L.push("Sujet choisi : " + sujetPerso());
  L.push("");
  L.push("— CHIFFRES —");
  function metr(label, key){
    var m = state.m[key]; if(!m || m.vide) return;
    L.push(label + " : " + METRICS.map(function(x){ return x.l + " " + fmt(m[x.k], x.d); }).join(" · "));
  }
  metr("Début", "t1"); metr("Fin", "t2"); metr("Essai 1", "essai1"); metr("Essai 2", "essai2"); metr("Essai 3", "essai3");
  if(state.a.t1_diff && state.a.t1_diff.length) L.push("Difficile au début : " + state.a.t1_diff.join(", "));
  L.push("");
  L.push("— ÉCOUTE —");
  C.ecoute.forEach(function(x, n){
    x.questions.forEach(function(q, i){ var v = state.a["q_" + x.id + "_" + i]; if(v != null) L.push("Extrait " + (n+1) + ", question " + (i+1) + " : " + (v === q.bonne ? "juste" : "à revoir")); });
  });
  L.push("");
  L.push("— PHRASES UTILES —");
  C.phrases.forEach(function(p){
    var v = state.fs[p.id];
    L.push((v === "ok" ? "[je la connais] " : v === "no" ? "[à revoir] " : "[—] ") + p.forme + (state.a["ma_" + p.id] ? "  →  " + state.a["ma_" + p.id] : ""));
  });
  var said = state.a.t2_phrases || {};
  var dites = C.phrases.filter(function(p, i){ return said[i]; }).map(function(p){ return p.forme; });
  if(dites.length) L.push("Dites à la fin du cours : " + dites.join(" | "));
  L.push("");
  L.push("— OBJECTIF DE LA SEMAINE —");
  var ef = C.phrases.filter(function(p){ return p.id === state.a.engF; })[0];
  if(ef) L.push("Phrase : " + ef.forme);
  if(state.a.engQuand) L.push("Quand : " + state.a.engQuand);
  if(state.a.engPhrase) L.push("Ma phrase exacte : " + state.a.engPhrase);
  return L.join("\n");
}
function openExport(){
  var mask = el("div","mask"), mo = el("div","modal");
  mo.setAttribute("role","dialog"); mo.setAttribute("aria-modal","true");
  mo.appendChild(el("h3",null,"Copier mes réponses"));
  mo.appendChild(el("p","small muted","Copiez ce texte et envoyez-le à votre formateur (e-mail ou messagerie)."));
  var ta = document.createElement("textarea"); ta.id = "exportText"; ta.value = buildExport(); ta.readOnly = true; mo.appendChild(ta);
  var r = el("div","row");
  var cp = el("button","btn btn-primary","Copier"); cp.type = "button";
  var done = el("span","small muted","");
  cp.addEventListener("click", function(){
    var ok = function(){ done.textContent = "Copié."; };
    var fb = function(){ ta.focus(); ta.select(); done.textContent = "Texte sélectionné : faites Cmd+C (Mac) ou Ctrl+C (PC)."; };
    try{ navigator.clipboard.writeText(ta.value).then(ok, fb); }catch(e){ fb(); }
  });
  var cl = el("button","btn","Fermer"); cl.type = "button";
  function close(){ mask.remove(); document.removeEventListener("keydown", esc); }
  function esc(e){ if(e.key === "Escape") close(); }
  cl.addEventListener("click", close);
  mask.addEventListener("click", function(e){ if(e.target === mask) close(); });
  document.addEventListener("keydown", esc);
  r.appendChild(cp); r.appendChild(cl); r.appendChild(done); mo.appendChild(r);
  mask.appendChild(mo); document.body.appendChild(mask); cp.focus();
}
document.getElementById("exportBtn").addEventListener("click", openExport);
